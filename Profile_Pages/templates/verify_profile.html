<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Password — Life Pages</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='finance.css') }}">
    <link rel="stylesheet" href="{{ url_for('profile_static', filename='profile.css') }}?v=2">
    <script src="/calendar_static/themecolor.js"></script>
    <script>
    (function(){
        // 先用 localStorage 里缓存的主题名快速上色（避免刚加载页面时
        // 先短暂闪一下默认主题再变成正确的），然后再用 fetch 去问后端
        // "这个用户实际保存的主题是什么"，确认一致后覆盖成准确值——
        // 这个页面没有像其他页面那样把主题值直接嵌进 <script id="theme-data">
        // 标签里（可能是因为这个页面本来就比较简单），所以改成用一次
        // 网络请求去后端确认，而不是模板渲染时就直接嵌进去。
        // Applies the theme cached in localStorage first (avoiding a
        // brief flash of the default theme before the correct one loads),
        // then fetches "what theme does this user actually have saved"
        // from the backend and overwrites with the confirmed value. This
        // page doesn't embed the theme value directly via a
        // <script id="theme-data"> tag like other pages do (likely just
        // because this page is simpler), so it asks the backend over the
        // network instead of having it baked in at template-render time.

        setTheme(localStorage.getItem('lifepages-theme') || 'mocha');
        fetch('/api/user-theme')
            .then(function(r){ return r.json(); })
            .then(function(d){
                var t = d.theme || 'mocha';
                setTheme(t);
                document.body.className = document.body.className
                    .replace(/\b(mocha|lavender|matcha|ash)\b/g, '').trim() + ' ' + t;
            });
    })();
    </script>
    <link rel="stylesheet" href="/shared_static/page-transitions.css">
</head>
<body class="mocha">

<nav class="navbar">
    <div class="logo-section">
        <div class="logo-box">
            <img src="/calendar_static/images/LifePages.png" alt="Life Pages">
        </div>
        <div class="logo-text">Life Pages</div>
    </div>
    <div class="nav-links">
        <a href="/dashboard">Home</a>
        <a href="/today">Today</a>
        <a href="/finance">Finance Page</a>
        <a href="/diary_homepage">Diary Page</a>
        <a href="/calendar">Calendar Page</a>
        <a href="/profile" class="active-link">Settings</a>
    </div>
</nav>

<div class="centered-page-wrapper">
    <div class="card centered-card">
        <div class="centered-icon">🔒</div>
        <div class="section-title">Verify Your Identity</div>
        <p class="centered-desc">Enter your current password to continue to Edit Profile.</p>

        {% if error %}
        <div class="form-error">Incorrect password. Please try again.</div>
        {% endif %}

        <form method="POST" class="centered-form">
            <div class="form-group">
                <label class="form-label">Current Password</label>
                <div class="form-input-wrap">
                    <input
                        type="password"
                        id="verifyPassword"
                        name="password"
                        class="form-input{% if error %} form-input-error{% endif %}"
                        placeholder="Enter your password"
                        autofocus
                        required
                    >
                    <span class="form-toggle-eye" onclick="togglePassword('verifyPassword',this)">🙈</span>
                </div>
            </div>
            <button type="submit" class="btn form-submit-btn">Verify &amp; Continue</button>
        </form>

        <a href="/profile" class="page-back-link">← Back to Settings</a>
    </div>
</div>

    <script>
    function togglePassword(inputId, eyeEl) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') { input.type = 'text'; eyeEl.textContent = '🙉'; }
        else                           { input.type = 'password'; eyeEl.textContent = '🙈'; }
    }
    </script>
    <script src="/shared_static/page-transitions.js" defer></script>
</body>
</html>
