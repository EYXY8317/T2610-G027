<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile — Life Pages</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='finance.css') }}">
    <link rel="stylesheet" href="{{ url_for('profile_static', filename='profile.css') }}">
    <script src="/calendar_static/themecolor.js"></script>
    <script id="theme-data" type="application/json">{{ (user.theme if user and user.theme else 'mocha') | tojson }}</script>
    <script>
    (function(){
        var theme = JSON.parse(document.getElementById('theme-data').textContent);
        setTheme(theme);
    })();
    </script>
    <link rel="stylesheet" href="/shared_static/page-transitions.css">
</head>
<body class="{{ user.theme if user and user.theme else 'mocha' }}">

<nav class="navbar">
    <div class="logo-section">
        <div class="logo-box">
            <img src="/calendar_static/images/LifePages.png" alt="Life Pages">
        </div>
        <div class="logo-text">Life Pages</div>
    </div>
    <div class="nav-links">
        <a href="/dashboard">Home</a>
        <a href="/today">Today</a>
        <a href="/finance">Finance Page</a>
        <a href="/diary_homepage">Diary Page</a>
        <a href="/calendar">Calendar Page</a>
        <a href="/profile" class="active-link">Settings</a>
    </div>
</nav>

<div class="centered-page-wrapper">
    <div class="card centered-card edit-card">
        <div class="centered-icon">✏️</div>
        <div class="section-title">Edit Profile</div>
        <p class="centered-desc">Update your username or profile picture.</p>

        <form method="POST" enctype="multipart/form-data" class="centered-form">

            <div class="form-group">
                <label class="form-label">Profile Picture</label>

                {% if user.profile_picture %}
                <img
                    id="picture-preview"
                    src="/profile_static/profile_pictures/{{ user.profile_picture }}"
                    class="profile-pic"
                    style="width:100px; height:100px; margin-bottom:14px;"
                >
                {% else %}
                <img
                    id="picture-preview"
                    src="https://via.placeholder.com/100"
                    class="profile-pic"
                    style="width:100px; height:100px; margin-bottom:14px;"
                >
                {% endif %}

                <div class="file-upload">
                    <label class="file-upload-label">
                        <span class="file-upload-btn">📷 Choose Photo</span>
                        <span class="file-upload-name">No file chosen</span>
                        <input type="file" name="profile_picture" class="file-input-hidden" accept="image/*">
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Username</label>
                <input
                    type="text"
                    name="username"
                    class="form-input"
                    value="{{ user.username }}"
                    required
                >
            </div>

            <button type="submit" class="btn form-submit-btn">Save Changes</button>

        </form>

        <a href="/profile" class="page-back-link">← Back to Settings</a>
    </div>
</div>

<script>
// FileReader：浏览器内置的对象，可以在文件真正上传到服务器之前，
// 先在浏览器本地把选中的图片读出来预览。readAsDataURL(file) 会把
// 图片转换成一段 base64 编码的文字（data URL），读取完成后触发
// onload，这时候把这段文字直接赋给 <img> 的 src，就能立刻看到
// 选中的新头像长什么样，不需要真的先上传到后端才能预览。
// FileReader: a built-in browser object that can read a selected image
// locally in the browser, before it's ever uploaded to the server.
// readAsDataURL(file) converts the image into a base64-encoded text
// string (a data URL); once reading finishes, onload fires, and assigning
// that string directly to the <img>'s src shows the newly picked avatar
// immediately — no need to actually upload it to the backend first just
// to preview it.

document.querySelectorAll('.file-input-hidden').forEach(function(input){
    input.addEventListener('change', function(){
        var el = this.closest('.file-upload-label').querySelector('.file-upload-name');
        var file = this.files[0];
        el.textContent = file ? file.name : 'No file chosen';

        if (file) {
            var reader = new FileReader();
            reader.onload = function(e){
                document.getElementById('picture-preview').src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    });
});
</script>

    <script src="/shared_static/page-transitions.js" defer></script>
</body>
</html>
