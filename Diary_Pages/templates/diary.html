<html>
<head>
    <title>Diary</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="/diary_static/style.css?v=4">
    <script src="/calendar_static/themecolor.js"></script>
    <script>
    setTheme(localStorage.getItem('lifepages-theme') || 'mocha');
    fetch('/api/user-theme')
        .then(function(r){ return r.json(); })
        .then(function(d){ setTheme(d.theme || 'mocha'); });
    </script>
    <style>
        #canvas {
            position: relative;
            min-height: 520px;
            width: 100%;
            background-color: var(--diary-canvas-bg);
            background-image:
                linear-gradient(var(--diary-grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--diary-grid-line) 1px, transparent 1px);
            background-size: 30px 30px;
            border: 1px solid var(--diary-canvas-border);
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            overflow: hidden;
            cursor: crosshair;
        }

        /* Paper types */
        #canvas.paper-blank  { background-image: none; }
        #canvas.paper-grid   {
            background-image:
                linear-gradient(var(--diary-grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--diary-grid-line) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        #canvas.paper-dot    {
            background-image: radial-gradient(circle, var(--diary-grid-line) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        #canvas.paper-lined  {
            background-image: linear-gradient(var(--diary-grid-line) 1px, transparent 1px);
            background-size: 100% 30px;
        }

        .fbar-btn.active {
            background: var(--diary-btn-hover-bg);
            color: var(--diary-btn-hover-text);
            border-color: var(--diary-btn-hover-bg);
        }

        #box { display: none; }

        /* ── Textbox ── */
        .tb-wrap {
            position: absolute;
            z-index: 10;
            min-width: 80px;
        }

        .tb-toolbar {
            display: none;
            position: absolute;
            top: -30px;
            left: 0;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.92);
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 2px 6px;
            cursor: grab;
            white-space: nowrap;
            z-index: 20;
        }

        .tb-wrap:hover .tb-toolbar,
        .tb-wrap.active .tb-toolbar {
            display: flex;
        }

        /* ── View mode: hide all handles until Edit is pressed ── */
        #canvas.view-mode .tb-toolbar  { display: none !important; }
        #canvas.view-mode .tb-content  { cursor: default; pointer-events: none; }
        #canvas.view-mode .img-toolbar { display: none !important; }
        #canvas.view-mode .img-resize  { display: none !important; }

        .tb-toolbar-drag {
            font-size: 10px;
            color: #aaa;
            letter-spacing: 2px;
            cursor: grab;
            padding: 0 4px;
        }

        .tb-rotate-btn {
            font-size: 13px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0 4px;
            line-height: 1;
            color: #555;
            cursor: grab;
        }

        .tb-del-btn {
            font-size: 13px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0 4px;
            line-height: 1;
            color: #e74c3c;
            margin-left: auto;
        }

        .tb-content {
            min-width: 80px;
            min-height: 28px;
            padding: 4px 8px;
            border: 1.5px dashed transparent;
            outline: none;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            color: #2a2a2a;
            white-space: pre-wrap;
            word-break: break-word;
            cursor: text;
            background: transparent;
            border-radius: 4px;
        }

        .tb-wrap:hover .tb-content,
        .tb-wrap.active .tb-content {
            border-color: #aaa;
            background: rgba(255,255,255,0.55);
        }

        .tb-content:focus {
            border-color: #666;
            background: rgba(255,255,255,0.7);
        }

        .tb-content:empty::before {
            content: "Type here...";
            color: #bbb;
            font-style: italic;
            pointer-events: none;
        }

        .tb-content b, .tb-content strong {
            font-weight: 900;
        }

        .tb-content i, .tb-content em {
            /* Must stay the literal "italic" keyword, not a custom oblique
               angle — the browser's native bold/italic/underline toggle
               (execCommand/queryCommandState) checks computed font-style
               against "italic" exactly, and a different value breaks the
               toggle (clicking Italic again would fail to un-italicize). */
            font-style: italic;
        }

        /* ── Image ── */
        .img-wrap {
            position: absolute;
            z-index: 5;
            user-select: none;
        }

        .img-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-origin: center center;
        }

        .img-wrap img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .img-wrap .img-toolbar {
            display: none;
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.92);
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 2px 8px;
            white-space: nowrap;
            z-index: 20;
        }

        .img-wrap.active .img-toolbar {
            display: flex;
        }

        .img-toolbar span {
            font-size: 13px;
            cursor: grab;
            color: #555;
        }

        .img-toolbar .img-del-btn {
            font-size: 13px;
            cursor: pointer;
            background: none;
            border: none;
            color: #e74c3c;
            padding: 0 2px;
        }

        .img-resize {
            position: absolute;
            bottom: -6px;
            right: -6px;
            width: 14px;
            height: 14px;
            background: #555;
            border-radius: 50%;
            cursor: se-resize;
            z-index: 20;
            display: none;
        }

        .img-wrap.active .img-resize {
            display: block;
        }

        .img-toolbar .img-crop-btn {
            font-size: 13px;
            cursor: pointer;
            color: #555;
        }

        /* Cropping disables normal drag/resize/rotate for this image */
        .img-wrap.cropping .img-toolbar,
        .img-wrap.cropping .img-resize {
            display: none !important;
        }

        .img-crop-overlay {
            position: absolute;
            inset: 0;
            z-index: 30;
            cursor: default;
        }

        .img-crop-selection {
            position: absolute;
            border: 1.5px dashed #fff;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.55);
            cursor: move;
        }

        .img-crop-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #fff;
            border: 1.5px solid #555;
            border-radius: 50%;
            z-index: 31;
        }
        .img-crop-handle.nw { top: -6px;  left: -6px;  cursor: nwse-resize; }
        .img-crop-handle.ne { top: -6px;  right: -6px; cursor: nesw-resize; }
        .img-crop-handle.sw { bottom: -6px; left: -6px;  cursor: nesw-resize; }
        .img-crop-handle.se { bottom: -6px; right: -6px; cursor: nwse-resize; }

        .img-crop-actions {
            position: absolute;
            top: -34px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 32;
            white-space: nowrap;
        }

        .img-crop-actions button {
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
            border: 1px solid #ddd;
        }

        .img-crop-apply  { background: #edf2ed; color: #4a7a4a; border-color: #c0d4c0 !important; }
        .img-crop-cancel { background: #f0ede8; color: #555; }

        /* ── Format Bar ── */
        #formatBar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 0;
            margin-bottom: 0;
            border-bottom: 1px solid #ddd8cf;
            flex-wrap: wrap;
        }

        /* ── Auto Save Indicator ── */
        #autoSaveIndicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 36px;
            padding: 0 14px;
            border-radius: 999px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            border: 1px solid transparent;
            transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        }
        #autoSaveIndicator.save-saving {
            background: #ebe7e0;
            color: #999;
            border-color: #ddd8cf;
        }
        #autoSaveIndicator.save-saved {
            background: #edf2ed;
            color: #4a7a4a;
            border-color: #c0d4c0;
        }
        #autoSaveIndicator.save-failed {
            background: #fdf0ee;
            color: #b03a2e;
            border-color: #e8b4ae;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        #autoSaveIndicator.save-saving .save-icon {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        #uploadLabel {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: transparent;
            border: 1px solid var(--diary-canvas-border, #ddd8cf);
            color: var(--diary-text, #555);
            border-radius: 8px;
            padding: 5px 14px;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.15s;
        }

        #uploadLabel:hover {
            background: #1a1a1a;
            color: #F2EFE9;
            border-color: #1a1a1a;
        }

        .fbar-divider {
            width: 1px;
            height: 22px;
            background: #ddd8cf;
            margin: 0 4px;
        }

        #formatBar select {
            border: 1px solid var(--diary-canvas-border, #ddd8cf);
            background: transparent;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            color: var(--diary-text, #555);
            border-radius: 8px;
            padding: 4px 8px;
            outline: none;
            cursor: pointer;
        }

        #formatBar select option {
            color: #2a2a2a;
            background: #fff;
        }

        #formatBar select:hover { border-color: var(--diary-accent, #888); }

        #fontColor {
            width: 32px;
            height: 28px;
            border: 1px solid var(--diary-canvas-border, #ddd8cf);
            border-radius: 8px;
            padding: 2px;
            cursor: pointer;
            background: transparent;
            outline: none;
        }

        .fbar-btn {
            background: transparent;
            border: 1px solid var(--diary-canvas-border, #ddd8cf);
            color: var(--diary-text, #555);
            border-radius: 8px;
            padding: 4px 12px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.15s;
        }

        .fbar-btn:hover {
            background: #1a1a1a;
            color: #F2EFE9;
            border-color: #1a1a1a;
        }

        /* ── Canvas stretch handle ── */
        #canvasStretchHandle {
            width: 100%;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: s-resize;
            user-select: none;
            pointer-events: all;
            color: #ccc;
            border: 1px solid #ddd8cf;
            border-top: none;
            border-radius: 0 0 16px 16px;
            background: #f5f2ec;
            transition: background 0.15s, color 0.15s;
        }
        #canvasStretchHandle:hover { background: #ebe7e0; color: #aaa; }
        .stretch-dots { font-size: 11px; letter-spacing: 3px; line-height: 1; }

        /* ── Edit hint toast ── */
        #editHintToast {
            position: fixed;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: #1a1a1a;
            color: #F2EFE9;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 400;
            padding: 10px 20px;
            border-radius: 999px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.18);
            pointer-events: none;
            user-select: none;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 9999;
            white-space: nowrap;
        }
        #editHintToast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── Edit active state ── */
        #editBtn.edit-active {
            background: #edf2ed;
            color: #4a7a4a;
            border-color: #c0d4c0;
        }

        /* ── Done / Cancel popup ── */
        #editActionPopup {
            position: fixed;
            top: 76px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            align-items: center;
            gap: 10px;
            background: #fff;
            border: 1px solid #ddd8cf;
            border-radius: 999px;
            padding: 8px 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            z-index: 500;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            color: #555;
            white-space: nowrap;
        }
        #editActionPopup.show { display: flex; }
        #editDoneBtn, #editCancelBtn {
            border: none;
            border-radius: 999px;
            padding: 6px 18px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.15s;
        }
        #editDoneBtn { background: #edf2ed; color: #4a7a4a; border: 1px solid #c0d4c0; }
        #editDoneBtn:hover { opacity: 0.85; }
        #editCancelBtn { background: #f0ede8; color: #555; }
        #editCancelBtn:hover { background: #e5e0d8; }

        .profile{ display:flex; align-items:center; gap:10px; flex-shrink:0; margin-left:auto; }
        .profile-link{ text-decoration:none; color:#3b2f2a; font-weight:600; font-size:14px; }
        .profile-btn{ text-decoration:none; color:var(--primary, #8b5e3c); border:1.5px solid var(--primary, #8b5e3c); border-radius:10px; padding:8px 16px; font-size:14px; font-weight:600; transition:0.2s; white-space:nowrap; }

        .profile-btn-solid{ background:var(--primary, #8b5e3c); color:white; }
        .profile-btn-solid:hover{ background:var(--primary-accent, #c9a88a); }
    </style>

<!-- Day name + month/year -->
<!-- 星期几 + 月份/年份 -->
<script>
(function(){
    // dateDisplay 里存的是 "DD/MM/YYYY" 格式的日期文字，拆开三段
    // 分别拿到日/月/年，构造一个真正的 JS Date 对象，
    // 才能反查出"星期几"和对应的英文月份名称。
    // dateDisplay holds the date as "DD/MM/YYYY" text; splitting it into
    // day/month/year and building a real JS Date object is what lets the
    // day-of-week and month name be looked up below.

    const raw = document.getElementById("dateDisplay").innerText.trim();
    const parts = raw.split("/");
    if (parts.length === 3) {
        const d = new Date(parts[2], parts[1]-1, parts[0]);
        const days   = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
        const months = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE",
                        "JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
        document.getElementById("dayName").innerText   = days[d.getDay()];
        document.getElementById("monthYear").innerText = months[d.getMonth()]+" "+d.getFullYear();
    }
})();
</script>

<!-- ===== CANVAS LOGIC ===== -->
<!-- ===== 画布逻辑 ===== -->
<script>
(function(){
    const canvas    = document.getElementById("canvas");
    const box       = document.getElementById("box");
    const fFamily   = document.getElementById("fontFamily");
    const fSize     = document.getElementById("fontSize");
    const fColor    = document.getElementById("fontColor");
    const boldBtn      = document.getElementById("boldBtn");

    // ================= DEEP-UNWRAP (self-heal legacy multi-encoded chunks) =================
    // ================= 深度解包（自愈旧数据里多层编码的区块） =================
    // A properly saved chunk needs exactly one JSON.parse to become an
    // element object. Older/corrupted data may have been JSON-stringified
    // more than once (each stray resave of an unparsed chunk wraps it
    // again), so a plain single JSON.parse leaves a *string* instead of an
    // object, or throws outright. This keeps parsing while the result is
    // still a string, so the real element is recovered no matter how many
    // extra layers of escaping piled up, and reports whether more than one
    // layer was found so the caller can trigger a self-heal resave.
    // 正常保存的区块只需要一次 JSON.parse 就能变成对象。旧数据/被污染的
    // 数据可能被多次 JSON.stringify 过（每次把还没解析成功的区块原样存回去，
    // 就会再包一层），这样单次 JSON.parse 出来的还是一个字符串而不是对象，
    // 或者直接解析报错。这个函数会一直解析，只要结果还是字符串就继续解，
    // 不管叠了多少层转义都能把真正的内容还原出来，并且会告诉调用者
    // 是否发现了不止一层（多层的话调用者就应该触发一次"自愈"重新保存）。

    function deepUnwrapElement(raw) {
        let value = raw;
        let layers = 0;
        while (typeof value === "string" && layers < 20) {
            try {
                value = JSON.parse(value);
            } catch (e) {
                return { obj: null, layers: layers, corrupted: layers > 0 };
            }
            layers++;
        }
        const obj = (value && typeof value === "object") ? value : null;
        return { obj: obj, layers: layers, corrupted: layers !== 1 };
    }

    let _snapshot = null;

    // ================= SNAPSHOT (serialize / restore the whole canvas) =================
    // ================= 快照（把整个画布序列化 / 还原） =================
    // takeSnapshot() 把画布上所有的文本框和图片都读出来，打包成一份
    // 纯数据的对象（不包含任何 DOM 元素本身）——这份数据既能存去后端
    // （自动保存），也能存进撤销/重做栈里，还能在"取消编辑"时用来
    // 把画布还原回进入编辑模式之前的样子。
    // restoreSnapshot() 做的是相反的事：把这样一份数据重新"画"回画布上
    // （先清空画布上所有现有的文本框/图片，再依照数据逐个重新创建）。
    // takeSnapshot() reads every text box and image currently on the
    // canvas and packages them into a plain data object (no DOM elements
    // themselves) — this data can be sent to the backend (autosave),
    // pushed onto the undo/redo stacks, or used to restore the canvas to
    // how it looked before entering edit mode if editing is cancelled.
    // restoreSnapshot() does the reverse: it "redraws" that data back onto
    // the canvas (first clearing every existing text box/image, then
    // recreating each one from the data).

    function takeSnapshot() {
        const chunks = [];
        chunks.push(JSON.stringify({ type: "meta", paper: paperSel ? paperSel.value : "grid" }));
        canvas.querySelectorAll(".tb-wrap").forEach(wrap => {
            const tb = wrap.querySelector(".tb-content");
            if (!tb || tb.innerText.trim() === "") return;
            chunks.push(JSON.stringify({
                type: "text",
                x:  parseFloat(wrap.style.left)     || 0,
                y:  parseFloat(wrap.style.top)      || 0,
                ff: tb.style.fontFamily || "Inter",
                fs: tb.style.fontSize   || "16px",
                fc: tb.style.color      || "#2a2a2a",
                fw: tb.style.fontWeight || "",
                fst: tb.style.fontStyle || "",
                td: tb.style.textDecoration || "",
                r:  parseFloat(wrap.dataset.rotate) || 0,
                html: tb.innerHTML
            }));
        });
        canvas.querySelectorAll(".img-wrap").forEach(wrap => {
            const imgEl = wrap.querySelector("img");
            const inner = wrap.querySelector(".img-inner");
            chunks.push(JSON.stringify({
                type: "img",
                x:  parseFloat(wrap.style.left)       || 0,
                y:  parseFloat(wrap.style.top)        || 0,
                w:  parseFloat(wrap.style.width)      || 160,
                h:  parseFloat(wrap.style.height)     || 120,
                r:  parseFloat(inner.dataset.rotate)  || 0,
                src: imgEl.src
            }));
        });
        return {
            content: chunks.join("||ITEM||"),
            mood:  moodSel  ? moodSel.value  : "",
            topic: topicInp ? topicInp.value : "",
            paper: paperSel ? paperSel.value : "grid"
        };
    }

    function restoreSnapshot(snap) {
        canvas.querySelectorAll(".tb-wrap, .img-wrap").forEach(el => el.remove());
        const items = snap.content.split("||ITEM||");
        items.forEach(item => {
            item = item.trim();
            if (!item) return;
            const { obj: d } = deepUnwrapElement(item);
            if (!d) return;
            if (d.type === "meta") {
                applyPaper(d.paper || "grid");
                if (paperSel) paperSel.value = d.paper || "grid";
            } else if (d.type === "text") {
                const tb = makeTb(d.x, d.y, d.html, d.r, false);
                tb.style.fontFamily = d.ff || "Inter";
                tb.style.fontSize   = d.fs || "16px";
                tb.style.color      = d.fc || "#2a2a2a";
                if (d.fw)  tb.style.fontWeight     = d.fw;
                if (d.fst) tb.style.fontStyle      = d.fst;
                if (d.td)  tb.style.textDecoration = d.td;
            } else if (d.type === "img") {
                makeImg(d.src, d.x, d.y, d.w, d.h, d.r, null);
            }
        });
        if (moodSel) {
            moodSel.value = snap.mood;
            const moodPicker = document.getElementById("mood-picker");
            if (moodPicker) {
                moodPicker.querySelectorAll(".mood-img-btn").forEach(b => {
                    b.classList.toggle("mood-img-btn--selected", b.dataset.value === snap.mood);
                });
            }
        }
        if (topicInp) topicInp.value = snap.topic;
    }

    /* ════════════════════════════════
       UNDO / REDO
       撤销 / 重做
    ════════════════════════════════ */
    // 撤销/重做用两个"栈"（stack，后进先出的列表）实现：每次操作前
    // 用 pushHistory() 把"操作前"的快照存进 _undoStack；点撤销时，
    // 把当前状态先存进 _redoStack（这样才能重做回来），再从
    // _undoStack 弹出上一个快照还原回去；点重做则是反过来。
    // _MAX_UNDO 限制最多记住 30 步，超过就用 .shift() 把最早的
    // 那一步丢掉，避免无限占用内存。只要做了任何新操作
    // （pushHistory 被调用），_redoStack 就会被清空——因为一旦分出了
    //新的操作分支，原本"重做"能恢复的那些历史就不再有意义了。
    // Undo/redo is implemented with two "stacks" (last-in-first-out
    // lists): pushHistory() saves a "before the operation" snapshot onto
    // _undoStack before every operation. Clicking undo first saves the
    // current state onto _redoStack (so it can be redone later), then
    // pops the last snapshot off _undoStack and restores it; redo works
    // the opposite way. _MAX_UNDO caps memory at 30 remembered steps,
    // discarding the oldest via .shift() once exceeded. Any time a new
    // operation happens (pushHistory is called), _redoStack is cleared —
    // once a new branch of edits happens, whatever "redo" could have
    // restored no longer makes sense to keep.

    const _undoStack = [];
    const _redoStack = [];
    const _MAX_UNDO  = 30;
    const undoBtnEl  = document.getElementById("undoBtn");
    const redoBtnEl  = document.getElementById("redoBtn");

    function _syncUndoRedoBtns() {
        if (undoBtnEl) undoBtnEl.disabled = _undoStack.length === 0;
        if (redoBtnEl) redoBtnEl.disabled = _redoStack.length === 0;
    }

    function pushHistory() {
        if (!canEdit) return;
        _undoStack.push(takeSnapshot());
        if (_undoStack.length > _MAX_UNDO) _undoStack.shift();
        _redoStack.length = 0;
        _syncUndoRedoBtns();
    }

    if (undoBtnEl) {
        undoBtnEl.addEventListener("click", function() {
            if (!_undoStack.length) return;
            _redoStack.push(takeSnapshot());
            restoreSnapshot(_undoStack.pop());
            _syncUndoRedoBtns();
            schedSave();
        });
    }

    if (redoBtnEl) {
        redoBtnEl.addEventListener("click", function() {
            if (!_redoStack.length) return;
            _undoStack.push(takeSnapshot());
            restoreSnapshot(_redoStack.pop());
            _syncUndoRedoBtns();
            schedSave();
        });
    }

    /* ════════════════════════════════
       DRAG HELPER
    ════════════════════════════════ */
    function makeDraggable(el, handle) {
        handle.addEventListener("mousedown", function(e){
            if (!canEdit) return;
            if (e.target.isContentEditable) return;
            if (e.button !== 0) return;
            if (el.classList.contains("cropping")) return;
            e.preventDefault();
            e.stopPropagation();
            pushHistory();

            const startX   = e.clientX;
            const startY   = e.clientY;
            const origLeft = parseFloat(el.style.left) || 0;
            const origTop  = parseFloat(el.style.top)  || 0;

            function onMove(e){
                const cr = canvas.getBoundingClientRect();
                let nl = origLeft + (e.clientX - startX);
                let nt = origTop  + (e.clientY - startY);
                nl = Math.max(0, Math.min(nl, cr.width  - el.offsetWidth));
                nt = Math.max(0, Math.min(nt, cr.height - el.offsetHeight));
                el.style.left = nl + "px";
                el.style.top  = nt + "px";
            }
            function onUp(){
                document.removeEventListener("mousemove", onMove);
                document.removeEventListener("mouseup", onUp);
                schedSave();
            }
            document.addEventListener("mousemove", onMove);
            document.addEventListener("mouseup", onUp);
        });
    }

    /* ════════════════════════════════
       ROTATE HELPER
    ════════════════════════════════ */
    function makeRotatable(rotateBtn, target) {
        rotateBtn.addEventListener("mousedown", function(e){
            if (!canEdit) return;
            e.preventDefault();
            e.stopPropagation();
            pushHistory();

            const SNAP_DEG = 5; // snap when within this many degrees of a 90° step

            const rect = target.getBoundingClientRect();
            const cx = rect.left + rect.width  / 2;
            const cy = rect.top  + rect.height / 2;
            const startAngle    = Math.atan2(e.clientY - cy, e.clientX - cx) * (180 / Math.PI);
            const startRotation = parseFloat(target.dataset.rotate || "0");

            function onMove(e){
                const angle = Math.atan2(e.clientY - cy, e.clientX - cx) * (180 / Math.PI);
                let newRotation = startRotation + (angle - startAngle);

                // The rotate handle always sits at the box's current angle
                // (it rotates along with it), so a fresh drag starts right on
                // top of whichever 90° step the box is already at. Snapping
                // back onto that same step would swallow the first few
                // degrees of every drag — so only snap onto steps other than
                // the one it started at.
                const nearestStep = Math.round(newRotation / 90) * 90;
                if (nearestStep !== startRotation && Math.abs(newRotation - nearestStep) < SNAP_DEG) {
                    newRotation = nearestStep;
                }

                target.style.transform = "rotate(" + newRotation + "deg)";
                target.dataset.rotate  = newRotation;
            }
            function onUp(){
                document.removeEventListener("mousemove", onMove);
                document.removeEventListener("mouseup", onUp);
                schedSave();
            }
            document.addEventListener("mousemove", onMove);
            document.addEventListener("mouseup", onUp);
        });
    }

    /* ════════════════════════════════
       IMAGE CROP
       Crop is edited against the image's own unrotated box (rotation is
       reset for the duration of the crop, then restored), so the overlay's
       pixel math never has to account for rotation.
    ════════════════════════════════ */
    function startImageCrop(wrap, inner, img) {
        if (wrap.classList.contains("cropping")) return;

        const origRotate = inner.dataset.rotate || 0;
        inner.style.transform = "rotate(0deg)";
        wrap.classList.add("cropping");

        const boxW = wrap.offsetWidth;
        const boxH = wrap.offsetHeight;

        const overlay = document.createElement("div");
        overlay.className = "img-crop-overlay";

        const inset = Math.min(boxW, boxH) * 0.1;
        let selLeft = inset, selTop = inset;
        let selW = Math.max(20, boxW - inset * 2);
        let selH = Math.max(20, boxH - inset * 2);

        const selection = document.createElement("div");
        selection.className = "img-crop-selection";

        const actions = document.createElement("div");
        actions.className = "img-crop-actions";
        const applyBtn = document.createElement("button");
        applyBtn.type = "button";
        applyBtn.className = "img-crop-apply";
        applyBtn.textContent = "✓ Apply";
        const cancelBtn = document.createElement("button");
        cancelBtn.type = "button";
        cancelBtn.className = "img-crop-cancel";
        cancelBtn.textContent = "✕ Cancel";
        actions.appendChild(applyBtn);
        actions.appendChild(cancelBtn);

        const handles = {};
        ["nw", "ne", "sw", "se"].forEach(corner => {
            const h = document.createElement("div");
            h.className = "img-crop-handle " + corner;
            handles[corner] = h;
            selection.appendChild(h);
        });

        selection.appendChild(actions);
        overlay.appendChild(selection);
        inner.appendChild(overlay);

        function render() {
            selection.style.left   = selLeft + "px";
            selection.style.top    = selTop  + "px";
            selection.style.width  = selW    + "px";
            selection.style.height = selH    + "px";
        }
        render();

        function clampSelection() {
            selLeft = Math.max(0, Math.min(selLeft, boxW - selW));
            selTop  = Math.max(0, Math.min(selTop,  boxH - selH));
        }

        function cleanup() {
            overlay.remove();
            wrap.classList.remove("cropping");
            inner.style.transform = origRotate ? ("rotate(" + origRotate + "deg)") : "";
            if (origRotate) inner.dataset.rotate = origRotate;
        }

        // Drag to move the selection box
        selection.addEventListener("mousedown", function(e){
            if (e.target !== selection) return;
            e.preventDefault();
            e.stopPropagation();
            const startX = e.clientX, startY = e.clientY;
            const origLeft = selLeft, origTop = selTop;
            function onMove(e){
                selLeft = origLeft + (e.clientX - startX);
                selTop  = origTop  + (e.clientY - startY);
                clampSelection();
                render();
            }
            function onUp(){
                document.removeEventListener("mousemove", onMove);
                document.removeEventListener("mouseup", onUp);
            }
            document.addEventListener("mousemove", onMove);
            document.addEventListener("mouseup", onUp);
        });

        // Drag corner handles to resize the selection box
        const MIN_SEL = 20;
        Object.keys(handles).forEach(corner => {
            handles[corner].addEventListener("mousedown", function(e){
                e.preventDefault();
                e.stopPropagation();
                const startX = e.clientX, startY = e.clientY;
                const orig = { left: selLeft, top: selTop, w: selW, h: selH };
                function onMove(e){
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    let { left, top, w, h } = orig;
                    if (corner.includes("w")) { left = orig.left + dx; w = orig.w - dx; }
                    if (corner.includes("e")) { w = orig.w + dx; }
                    if (corner.includes("n")) { top = orig.top + dy; h = orig.h - dy; }
                    if (corner.includes("s")) { h = orig.h + dy; }

                    if (w < MIN_SEL) { if (corner.includes("w")) left -= (MIN_SEL - w); w = MIN_SEL; }
                    if (h < MIN_SEL) { if (corner.includes("n")) top  -= (MIN_SEL - h); h = MIN_SEL; }
                    left = Math.max(0, left);
                    top  = Math.max(0, top);
                    w = Math.min(w, boxW - left);
                    h = Math.min(h, boxH - top);

                    selLeft = left; selTop = top; selW = w; selH = h;
                    render();
                }
                function onUp(){
                    document.removeEventListener("mousemove", onMove);
                    document.removeEventListener("mouseup", onUp);
                }
                document.addEventListener("mousemove", onMove);
                document.addEventListener("mouseup", onUp);
            });
        });

        cancelBtn.addEventListener("mousedown", e => { e.preventDefault(); e.stopPropagation(); });
        cancelBtn.addEventListener("click", function(e){
            e.preventDefault();
            e.stopPropagation();
            cleanup();
        });

        applyBtn.addEventListener("mousedown", e => { e.preventDefault(); e.stopPropagation(); });
        applyBtn.addEventListener("click", function(e){
            e.preventDefault();
            e.stopPropagation();

            const scaleX = img.naturalWidth  / boxW;
            const scaleY = img.naturalHeight / boxH;
            const sx = selLeft * scaleX;
            const sy = selTop  * scaleY;
            const sw = selW    * scaleX;
            const sh = selH    * scaleY;

            const off = document.createElement("canvas");
            off.width  = Math.max(1, Math.round(sw));
            off.height = Math.max(1, Math.round(sh));
            off.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, off.width, off.height);

            off.toBlob(function(blob){
                if (!blob) { cleanup(); return; }
                pushHistory();
                const fd = new FormData();
                fd.append("file", blob, "cropped.png");
                fetch("/upload_image", { method: "POST", body: fd })
                    .then(r => r.json())
                    .then(res => {
                        if (res.url) {
                            img.src = res.url;
                            wrap.style.left   = (parseFloat(wrap.style.left) || 0) + selLeft + "px";
                            wrap.style.top    = (parseFloat(wrap.style.top)  || 0) + selTop  + "px";
                            wrap.style.width  = selW + "px";
                            wrap.style.height = selH + "px";
                        }
                        cleanup();
                        schedSave();
                    })
                    .catch(() => cleanup());
            }, "image/png");
        });
    }

    /* ════════════════════════════════
       TEXTBOX
    ════════════════════════════════ */
    canvas.addEventListener("mousedown", function(e){
        if (!canEdit) return;
        if (!e.target.closest(".img-wrap")) {
            document.querySelectorAll(".img-wrap.active").forEach(el => el.classList.remove("active"));
        }
        if (e.target !== canvas) return;
        e.preventDefault();
        pushHistory();
        const rect = canvas.getBoundingClientRect();
        makeTb(e.clientX - rect.left, e.clientY - rect.top, "", 0, true);
    });

    function makeTb(x, y, html, rotateDeg, doFocus) {
        const wrap = document.createElement("div");
        wrap.className  = "tb-wrap pop-in";
        wrap.style.left = x + "px";
        wrap.style.top  = y + "px";

        const toolbar = document.createElement("div");
        toolbar.className = "tb-toolbar";

        const dragHandle = document.createElement("span");
        dragHandle.className   = "tb-toolbar-drag";
        dragHandle.textContent = "⠿ drag";

        const rotBtn = document.createElement("button");
        rotBtn.className   = "tb-rotate-btn";
        rotBtn.textContent = "⟳ rotate";
        rotBtn.title       = "Drag to rotate";

        const delBtn = document.createElement("button");
        delBtn.className   = "tb-del-btn";
        delBtn.textContent = "✕";
        delBtn.title       = "Delete";

        toolbar.appendChild(dragHandle);
        toolbar.appendChild(rotBtn);
        toolbar.appendChild(delBtn);

        const tb = document.createElement("div");
        tb.className       = "tb-content";
        tb.contentEditable = canEdit ? "true" : "false";
        tb.innerHTML       = html;
        tb.style.fontFamily = fFamily.value;
        tb.style.fontSize   = fSize.value;
        tb.style.color      = fColor.value;
        if (rotateDeg) {
            wrap.style.transform = "rotate(" + rotateDeg + "deg)";
            wrap.dataset.rotate  = rotateDeg;
        }

        tb.addEventListener("focus", ()=>{
            activeTb = tb;
            wrap.classList.add("active");
            updateFormatButtons();
        });
        tb.addEventListener("blur", ()=>{
            wrap.classList.remove("active");
            setTimeout(()=>{
                if (!canvas.contains(document.activeElement) || !document.activeElement.classList.contains("tb-content")) {
                    updateFormatButtons();
                }
                if (tb.innerText.trim() === "" && !wrap.matches(":hover")) {
                    wrap.remove();
                    schedSave();
                }
            }, 200);
        });
        tb.addEventListener("input", schedSave);

        delBtn.addEventListener("mousedown", function(e){
            if (!canEdit) return;
            e.preventDefault();
            pushHistory();
            wrap.remove();
            schedSave();
        });

        wrap.appendChild(toolbar);
        wrap.appendChild(tb);
        canvas.appendChild(wrap);

        makeDraggable(wrap, dragHandle);
        makeRotatable(rotBtn, wrap);

        if (doFocus) { tb.focus(); activeTb = tb; }
        return tb;
    }

    /* ════════════════════════════════
       IMAGE
    ════════════════════════════════ */
    uploadImg.addEventListener("change", function(e){
        if (!canEdit) return;
        const file = e.target.files[0];
        if (!file) return;

        const fd = new FormData();
        fd.append("file", file);

        fetch("/upload_image", { method: "POST", body: fd })
            .then(r => r.json())
            .then(res => {
                if (!res.url) return;
                pushHistory();

                // Size the box to the photo's own aspect ratio so
                // object-fit:contain never has to letterbox it — otherwise
                // the visible photo sits inset from its draggable box and
                // can't actually reach the canvas edges.
                const probe = new Image();
                const insert = (w, h) => {
                    makeImg(res.url, 40, 40, w, h, 0, null);
                    schedSave();
                };
                probe.onload = function () {
                    const maxSize = 200;
                    const ratio = probe.naturalHeight / probe.naturalWidth;
                    let w = maxSize, h = maxSize * ratio;
                    if (h > maxSize) { h = maxSize; w = maxSize / ratio; }
                    insert(w, h);
                };
                probe.onerror = function () { insert(180, 135); };
                probe.src = res.url;
            });

        uploadImg.value = "";
    });


    function makeImg(src, x, y, w, h, rotateDeg, imgId) {
        const wrap = document.createElement("div");
        wrap.className   = "img-wrap pop-in";
        wrap.style.left  = x + "px";
        wrap.style.top   = y + "px";
        wrap.style.width = w + "px";
        wrap.style.height= h + "px";
        if (imgId) wrap.dataset.imgId = imgId;

        const inner = document.createElement("div");
        inner.className = "img-inner";
        if (rotateDeg) {
            inner.style.transform = "rotate(" + rotateDeg + "deg)";
            inner.dataset.rotate  = rotateDeg;
        }

        const img = document.createElement("img");
        img.src = src;

        const toolbar = document.createElement("div");
        toolbar.className = "img-toolbar";

        const rotBtn = document.createElement("span");
        rotBtn.textContent = "⟳ rotate";
        rotBtn.title       = "Drag to rotate";
        rotBtn.style.cursor = "grab";

        const cropBtn = document.createElement("span");
        cropBtn.className   = "img-crop-btn";
        cropBtn.textContent = "✂ crop";
        cropBtn.title       = "Crop image";

        const delBtn = document.createElement("button");
        delBtn.className   = "img-del-btn";
        delBtn.textContent = "✕ delete";

        toolbar.appendChild(rotBtn);
        toolbar.appendChild(cropBtn);
        toolbar.appendChild(delBtn);

        const resizeHandle = document.createElement("div");
        resizeHandle.className = "img-resize";

        inner.appendChild(img);
        wrap.appendChild(toolbar);
        wrap.appendChild(inner);
        wrap.appendChild(resizeHandle);
        canvas.appendChild(wrap);

        wrap.addEventListener("mousedown", function(e){
            if (!canEdit) return;
            document.querySelectorAll(".img-wrap.active").forEach(el => el.classList.remove("active"));
            wrap.classList.add("active");
        });

        makeDraggable(wrap, wrap);
        makeRotatable(rotBtn, inner);

        delBtn.addEventListener("mousedown", function(e){
            if (!canEdit) return;
            e.preventDefault();
            pushHistory();
            wrap.remove();
            schedSave();
        });

        cropBtn.addEventListener("mousedown", function(e){
            e.preventDefault();
            e.stopPropagation();
        });
        cropBtn.addEventListener("click", function(e){
            if (!canEdit) return;
            e.preventDefault();
            e.stopPropagation();
            startImageCrop(wrap, inner, img);
        });

        resizeHandle.addEventListener("mousedown", function(e){
            if (!canEdit) return;
            e.preventDefault();
            e.stopPropagation();
            pushHistory();
            const startX = e.clientX;
            const startW = wrap.offsetWidth;
            const startH = wrap.offsetHeight;
            const ratio  = startH / startW;

            function onMove(e){
                const cr   = canvas.getBoundingClientRect();
                const wl   = parseFloat(wrap.style.left) || 0;
                const wt   = parseFloat(wrap.style.top)  || 0;
                let newW   = Math.max(40, startW + (e.clientX - startX));
                let newH   = newW * ratio;
                if (wl + newW > cr.width)  newW = cr.width  - wl;
                if (wt + newH > cr.height) newH = cr.height - wt;
                wrap.style.width  = Math.max(40, newW) + "px";
                wrap.style.height = Math.max(30, newH) + "px";
            }
            function onUp(){
                document.removeEventListener("mousemove", onMove);
                document.removeEventListener("mouseup", onUp);
                schedSave();
            }
            document.addEventListener("mousemove", onMove);
            document.addEventListener("mouseup", onUp);
        });

        return wrap;
    }

    /* ════════════════════════════════
       FORMAT BAR
    ════════════════════════════════ */
    fFamily.addEventListener("change", function(){
        if (activeTb) activeTb.style.fontFamily = this.value;
    });
    fSize.addEventListener("change", function(){
        if (activeTb) activeTb.style.fontSize = this.value;
    });
    fColor.addEventListener("input", function(){
        if (!activeTb) return;
        const sel = window.getSelection();
        if (sel && sel.rangeCount > 0 && !sel.isCollapsed && activeTb.contains(sel.anchorNode)) {
            document.execCommand("foreColor", false, this.value);
        } else {
            activeTb.style.color = this.value;
        }
    });

    /* ════════════════════════════════
       BOLD / ITALIC / UNDERLINE
       Mirrors Word's toggle rules by driving the browser's native
       execCommand/queryCommandState state machine:
         - collapsed cursor  -> toggles the "typing state" for future input
         - uniform selection -> removes the formatting
         - mixed/none        -> applies the formatting to the whole selection
    ════════════════════════════════ */
    function closestTb(node) {
        if (!node) return null;
        const el = node.nodeType === 1 ? node : node.parentElement;
        return el ? el.closest(".tb-content") : null;
    }

    function updateFormatButtons() {
        const sel = window.getSelection();
        const tb = sel && sel.rangeCount > 0 ? closestTb(sel.anchorNode) : null;
        if (!tb) {
            boldBtn.classList.remove("active");
            italicBtn.classList.remove("active");
            underlineBtn.classList.remove("active");
            return;
        }
        try {
            boldBtn.classList.toggle("active", document.queryCommandState("bold"));
            italicBtn.classList.toggle("active", document.queryCommandState("italic"));
            underlineBtn.classList.toggle("active", document.queryCommandState("underline"));
        } catch (e) {}
    }

    document.addEventListener("selectionchange", updateFormatButtons);

    function toggleFormat(cmd) {
        if (!canEdit) return;
        if (!activeTb || document.activeElement !== activeTb) return;
        document.execCommand(cmd, false, null);
        updateFormatButtons();
        schedSave();
    }

    // mousedown + preventDefault (rather than click) keeps focus and the
    // live selection inside the textbox, so execCommand acts on it directly
    // instead of on whatever the button click would otherwise have blurred to.
    boldBtn.addEventListener("mousedown", function (e) {
        e.preventDefault();
        toggleFormat("bold");
    });
    italicBtn.addEventListener("mousedown", function (e) {
        e.preventDefault();
        toggleFormat("italic");
    });
    underlineBtn.addEventListener("mousedown", function (e) {
        e.preventDefault();
        toggleFormat("underline");
    });

    function applyPaper(type) {
        ["blank","grid","dot","lined"].forEach(t => canvas.classList.remove("paper-"+t));
        canvas.classList.add("paper-" + (type || "grid"));
    }
    const defaultPaper = localStorage.getItem(scopedKey("diaryPaperType")) || "grid";
    applyPaper(defaultPaper);
    if (paperSel) paperSel.value = defaultPaper;
    if (paperSel) paperSel.addEventListener("change", function(){
        applyPaper(this.value);
        localStorage.setItem(scopedKey("diaryPaperType"), this.value);
        schedSave();
    });

    function applyTheme(theme) {
        ["settings","dark","ocean","blush"].forEach(t => document.body.classList.remove("theme-"+t));
        if (theme && theme !== "classic") document.body.classList.add("theme-"+theme);
    }
    // Guests always see Classic — any saved "guest" theme predates the
    // format-bar login gate (guests can no longer change it), so it's
    // stale and gets cleared rather than applied.
    if (isGuest) {
        localStorage.removeItem(scopedKey("diaryTheme"));
    }
    const defaultTheme = isGuest ? "classic" : (localStorage.getItem(scopedKey("diaryTheme")) || "classic");
    applyTheme(defaultTheme);
    if (themeSel) themeSel.value = defaultTheme;
    if (themeSel) themeSel.addEventListener("change", function(){
        applyTheme(this.value);
        localStorage.setItem(scopedKey("diaryTheme"), this.value);
    });

    /* ════════════════════════════════
       SAVE
       保存
    ════════════════════════════════ */
    // 保存分三步：schedSave() 负责"防抖"（跟 script.js 里文字自动保存
    // 用的是同一个技巧——每次有新改动就重新等 1 秒，真正停手超过 1 秒
    // 才继续下一步），doSave() 把画布上所有内容序列化打包成一串文字，
    // sendSave() 才是真正调用 /autosave 接口把数据发给后端。
    // Saving happens in three steps: schedSave() debounces (the same
    // technique as the text autosave in script.js — every new edit resets
    // a 1-second wait, only proceeding once the user has actually paused
    // for a full second), doSave() serializes everything on the canvas
    // into one packed string, and sendSave() is what actually calls the
    // /autosave endpoint to send the data to the backend.

    function setAutoSave(state) {
        if (!autoSaveEl) return;
        autoSaveEl.className = "save-" + state;
        const icons  = { saving: "⟳", saved: "✓", failed: "⚠" };
        const labels = { saving: "Saving...", saved: "Saved", failed: "Save Failed" };
        if (saveIconEl)  saveIconEl.textContent  = icons[state]  || "";
        if (saveLabelEl) saveLabelEl.textContent = labels[state] || "";
    }

    // Shows the picked quote, or (if no mood is set, so the backend never
    // picked one) a nudge to select a mood, instead of leaving the box
    // sitting on the generic empty-state placeholder forever.
    function revealQuote(){
        if (!msgEl) return;
        if (latestQuote) {
            msgEl.innerText = latestQuote;
        } else if (moodSel && !moodSel.value) {
            msgEl.innerText = "Pick a mood above so we can leave you a quote here.";
        } else {
            msgEl.innerText = "";
        }
        msgEl.classList.remove("quote-reveal");
        void msgEl.offsetWidth;
        msgEl.classList.add("quote-reveal");
    }

    function schedSave(){
        clearTimeout(saveTimer);
        setAutoSave("saving");
        saveTimer = setTimeout(doSave, 1000);

        // Leave whatever quote is currently on screen alone (don't blank
        // it) while more edits come in — reload and re-entering Edit both
        // route through here (via the mood-sync dispatch / tb input), and
        // an already-shown quote shouldn't vanish just because of that.
        // Just requeue the reveal so it settles on the freshly-picked
        // quote once the user goes idle again.
        clearTimeout(quoteTimer);
        quoteTimer = setTimeout(revealQuote, 10000);
    }

    function doSave(revealImmediately){
        const chunks = [];
        chunks.push(JSON.stringify({ type: "meta", paper: paperSel ? paperSel.value : "grid" }));

        canvas.querySelectorAll(".tb-wrap").forEach(wrap => {
            const tb  = wrap.querySelector(".tb-content");
            if (!tb || tb.innerText.trim() === "") return;
            chunks.push(JSON.stringify({
                type: "text",
                x:  parseFloat(wrap.style.left)      || 0,
                y:  parseFloat(wrap.style.top)       || 0,
                ff: tb.style.fontFamily  || "Inter",
                fs: tb.style.fontSize    || "16px",
                fc: tb.style.color       || "#2a2a2a",
                fw: tb.style.fontWeight  || "",
                fst: tb.style.fontStyle  || "",
                td: tb.style.textDecoration || "",
                r:  parseFloat(wrap.dataset.rotate)  || 0,
                html: tb.innerHTML
            }));
        });

        canvas.querySelectorAll(".img-wrap").forEach(wrap => {
            const imgEl = wrap.querySelector("img");
            const inner = wrap.querySelector(".img-inner");
            chunks.push(JSON.stringify({
                type: "img",
                x:  parseFloat(wrap.style.left)      || 0,
                y:  parseFloat(wrap.style.top)       || 0,
                w:  parseFloat(wrap.style.width)     || 160,
                h:  parseFloat(wrap.style.height)    || 120,
                r:  parseFloat(inner.dataset.rotate) || 0,
                src: imgEl.src
            }));
        });

        sendSave(chunks.join("||ITEM||"), revealImmediately);
    }

    function sendSave(content, revealImmediately){
        const data = new FormData();
        data.append("content", content);
        data.append("mood",    moodSel  ? moodSel.value  : "");
        data.append("topic",   topicInp ? topicInp.value : "");
        data.append("date",    getDate());

        fetch("/autosave", { method:"POST", body:data })
            .then(r => r.json())
            .then(res => {
                setAutoSave("saved");
                if (res.message) latestQuote = res.message;
                if (revealImmediately) {
                    clearTimeout(quoteTimer);
                    revealQuote();
                }
            })
            .catch(()=>{ setAutoSave("failed"); });
    }

    if (moodSel)  moodSel.addEventListener("change", schedSave);
    if (topicInp) topicInp.addEventListener("input",  schedSave);

    /* ════════════════════════════════
       LOAD SAVED CONTENT
    ════════════════════════════════ */
    const savedRaw = {{ (entry.content if entry else '') | tojson }};
    let _neededHeal = false;
    if (savedRaw.trim()) {
        const items = savedRaw.split("||ITEM||");
        // Legacy pre-JSON diary entries were saved as a single plain-text
        // blob (no "||ITEM||" separators at all). Only content shaped like
        // that gets shown as raw text below — if it's a proper multi-chunk
        // record, an unparseable item here is corrupted data (from this
        // exact bug: a previously-broken chunk resurrected as visible text
        // and then re-saved as if it were real content), not legacy text,
        // so it gets dropped and healed away instead of displayed.
        const isLegacyPlainText = items.length === 1;
        items.forEach(item => {
            item = item.trim();
            if (!item) return;
            const { obj: d, corrupted } = deepUnwrapElement(item);
            if (corrupted) _neededHeal = true;
            if (!d) {
                if (isLegacyPlainText) {
                    // Truly unrecoverable (not JSON at any unwrap depth) —
                    // only legacy plain-text data should ever reach this branch.
                    if (item.length > 0) makeTb(40, 40, item, 0, false);
                } else {
                    _neededHeal = true;
                }
                return;
            }
            if (d.type === "meta") {
                applyPaper(d.paper || "grid");
                if (paperSel) paperSel.value = d.paper || "grid";
            } else if (d.type === "text") {
                const tb = makeTb(d.x, d.y, d.html, d.r, false);
                tb.style.fontFamily = d.ff || "Inter";
                tb.style.fontSize   = d.fs || "16px";
                tb.style.color      = d.fc || "#2a2a2a";
                if (d.fw)  tb.style.fontWeight     = d.fw;
                if (d.fst) tb.style.fontStyle      = d.fst;
                if (d.td)  tb.style.textDecoration = d.td;
            } else if (d.type === "img") {
                makeImg(d.src, d.x, d.y, d.w, d.h, d.r, null);
            }
        });
    }
    // Self-heal: if any chunk needed more than one layer of JSON parsing,
    // the stored content was corrupted by repeated re-encoding. The canvas
    // above was just rebuilt from the recovered (clean) data, so saving now
    // persists it back in the correct single-encoded format — the record
    // heals itself the next time its owner opens the page, no separate
    // migration step required. Guests never own the record, so they can't
    // (and shouldn't try to) trigger this write.
    if (_neededHeal && !isGuest) {
        doSave();
    }

    /* ════════════════════════════════
       CANVAS STRETCH (height only, no shrink)
    ════════════════════════════════ */
    const stretchHandle = document.getElementById("canvasStretchHandle");
    const _canvasHeightKey = scopedKey("diary-canvas-height-" + getDate());
    const _savedCanvasH = localStorage.getItem(_canvasHeightKey);
    if (_savedCanvasH) {
        canvas.style.height    = _savedCanvasH + "px";
        canvas.style.minHeight = _savedCanvasH + "px";
    }

    if (stretchHandle) {
        stretchHandle.addEventListener("mousedown", function(e) {
            e.preventDefault();
            e.stopPropagation();
            const startY = e.clientY;
            // Ensure canvas has an explicit height before dragging
            const currentH = canvas.offsetHeight || 520;
            canvas.style.height    = currentH + "px";
            canvas.style.minHeight = currentH + "px";

            function onMove(e) {
                const delta = e.clientY - startY;
                if (delta > 0) {
                    canvas.style.height    = (currentH + delta) + "px";
                    canvas.style.minHeight = (currentH + delta) + "px";
                }
            }
            function onUp() {
                document.removeEventListener("mousemove", onMove);
                document.removeEventListener("mouseup", onUp);
                localStorage.setItem(_canvasHeightKey, canvas.offsetHeight);
            }
            document.addEventListener("mousemove", onMove);
            document.addEventListener("mouseup", onUp);
        });
    }

})();
</script>

<!-- Mood ↔ Homepage sync (MOOD_LIST shared source of truth) -->
<!-- 心情 ↔ 首页同步（MOOD_LIST 是唯一的数据来源） -->
<script type="module">
import { MOOD_LIST, getMood, saveMood } from '/diary_home_static/js/mood_sync.js';

const moodInput  = document.getElementById("mood");
const moodPicker = document.getElementById("mood-picker");
const isDisabled = moodPicker && moodPicker.classList.contains("mood-picker-disabled");

if (moodInput && moodPicker) {
    MOOD_LIST.forEach(({ value, image, label, title }) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "mood-img-btn";
        btn.dataset.value = value;
        btn.disabled = isDisabled;
        btn.title = title;
        const img = document.createElement("img");
        img.src = image;
        img.alt = label;
        btn.appendChild(img);
        moodPicker.appendChild(btn);
    });

    // applyMoodUI: update UI only, no change event (no autosave side-effect)
    function applyMoodUI(value) {
        moodInput.value = value;
        moodPicker.querySelectorAll(".mood-img-btn").forEach(b => {
            b.classList.toggle("mood-img-btn--selected", b.dataset.value === value);
        });
    }

    // setMood: update UI + fire change event (triggers saveMood + autosave)
    function setMood(value) {
        applyMoodUI(value);
        moodInput.dispatchEvent(new Event("change"));
    }

    const backendMood = (moodInput.dataset.entryMood || "").toLowerCase().trim();
    const backendItem = MOOD_LIST.find(m => m.value === backendMood || m.emoji === backendMood);

    if (backendItem) {
        // Server mood takes priority: fire change event so saveMood + autosave run
        setMood(backendItem.value);
    } else {
        // No server mood — check if viewing today's diary and home page has a mood selected
        const today = new Date();
        const todayStr = String(today.getDate()).padStart(2, '0') + "/" +
                         String(today.getMonth() + 1).padStart(2, '0') + "/" +
                         today.getFullYear();
        const urlDate = new URLSearchParams(window.location.search).get("date");
        const displayDate = document.getElementById("dateDisplay")?.innerText?.trim() || "";
        const isToday = (urlDate || displayDate) === todayStr;

        if (isToday) {
            const localMood = getMood();
            const localItem = localMood ? MOOD_LIST.find(m => m.value === localMood) : null;
            if (localItem) {
                // Just show the mood — no change event, no autosave
                applyMoodUI(localItem.value);
            }
        }
    }

    moodPicker.addEventListener("click", e => {
        if (moodPicker.classList.contains("mood-picker-disabled")) {
            if (typeof window.showEditHint === "function") window.showEditHint();
            return;
        }
        const btn = e.target.closest(".mood-img-btn");
        if (!btn) return;
        setMood(btn.dataset.value);
        saveMood(btn.dataset.value);
    });

    moodInput.addEventListener("change", () => {
        if (moodInput.value) saveMood(moodInput.value);
    });

}
</script>
