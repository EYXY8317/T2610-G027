<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Diary Homepage
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap"
    >

    <link
        rel="stylesheet"
        href="/diary_home_static/css/dashboard.css?v=2"
    >

    <link
        rel="stylesheet"
        href="/diary_home_static/css/widget.css?v=2"
    >

    <link
        rel="stylesheet"
        href="/diary_home_static/css/settings.css"
    >

    <style>
        .profile{ display:flex; align-items:center; gap:10px; }
        .profile-link{ text-decoration:none; color:#3b2f2a; font-weight:600; font-size:14px; }
        .profile-btn{ text-decoration:none; color:var(--primary, #8b5e3c); border:1.5px solid var(--primary, #8b5e3c); border-radius:10px; padding:8px 16px; font-size:14px; font-weight:600; transition:0.2s; }
        .profile-btn:hover{ background:var(--primary-light, #f2e5d8); }
        .profile-btn-solid{ background:var(--primary, #8b5e3c); color:white; }
        .profile-btn-solid:hover{ background:var(--primary-accent, #c9a88a); }
    </style>

    <link
        rel="stylesheet"
        href="/diary_home_static/css/deco.css"
    >

    <script src="/calendar_static/themecolor.js"></script>
    <script>
    setTheme(localStorage.getItem('lifepages-theme') || 'mocha');
    fetch('/api/user-theme')
        .then(function(r){ return r.json(); })
        .then(function(d){ setTheme(d.theme || 'mocha'); });
    </script>

    <link rel="stylesheet" href="/shared_static/page-transitions.css">
</head>

<body>

<script>
fetch('/api/user-theme').then(function(r){return r.json();}).then(function(d){
    var bg={mocha:'#f7f3ee',lavender:'#f7f4ff',matcha:'#f7fbf7',ash:'#f5f5f5'};
    document.body.style.backgroundColor=bg[d.theme]||'#f7f3ee';
}).catch(function(){});
</script>

    <nav class="navbar">

        <div class="navbar-inner">

        <div class="logo-section">
            <div class="logo-box">
                <img src="/calendar_static/images/LifePages.png" alt="Life Pages">
            </div>
            <div class="logo-text">Life Pages</div>
        </div>

        <div class="nav-links">
            <a href="/dashboard">Home</a>
            <a href="/today">Today</a>
            <a href="/finance">Finance Page</a>
            <a href="/diary_homepage" class="active">Diary Page</a>
            <a href="/calendar">Calendar Page</a>
            <a href="/profile">Settings</a>
        </div>

        <div class="navbar-right">
            <button id="history-undo" class="history-btn" title="Undo" disabled>↩</button>
            <button id="history-redo" class="history-btn" title="Redo" disabled>↪</button>
            <button id="homepage-settings">⚙ Customize</button>
        </div>

        <div class="profile" id="navProfile"></div>

        </div>

    </nav>

    <script>
    fetch('/api/whoami').then(function(r){ return r.json(); }).then(function(d){
        var el = document.getElementById('navProfile');
        var inner = document.querySelector('.navbar-inner');
        if (d.username) {
            el.innerHTML = '';
            el.style.display = 'none';
            if (inner) inner.classList.add('profile-empty');
        } else {
            el.innerHTML =
                '<a href="/login" class="profile-btn">Login</a>' +
                '<a href="/login?panel=register" class="profile-btn profile-btn-solid">Sign Up</a>';
        }
    }).catch(function(){});
    </script>

    <div id="homepage-menu">

        <button id="edit-layout-btn">
            <span class="menu-icon">✏️</span> Edit Layout
        </button>

        <button id="deco-btn">
            <span class="menu-icon">🌸</span> Deco
        </button>

        <div id="homepage-menu-divider"></div>

        <button id="delete-all-widgets-btn">
            <span class="menu-icon">🗑️</span> Delete All Widgets
        </button>

        <button id="reset-layout-btn">
            <span class="menu-icon">↺</span> Reset Layout
        </button>

    </div>

    <div id="snap-line"></div>

    <div id="snap-line-horizontal"></div>

    <div id="gap-guide"></div>

    <div id="same-size-guide-v"></div>

    <div id="same-size-guide-h"></div>

    <div id="size-hud"></div>

    <div id="dashboard"></div>

    <script
        src="https://cdn.jsdelivr.net/npm/chart.js"
    ></script>

    <script
        type="module"
        src="/diary_home_static/js/main.js?v=2"
    ></script>

    <script src="/shared_static/page-transitions.js" defer></script>
</body>

</html>
