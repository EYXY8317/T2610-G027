<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Journal Homepage</title>

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="css/widget.css"
    >

</head>

<body>

    <div id="homepage-toolbar">

        <button
            id="homepage-settings"
        >
            ⚙ Customize Homepage
        </button>

    </div>

    <div id="homepage-menu">

        <button
            id="edit-layout-btn"
        >
            Edit Layout
        </button>

        <button>
            Add Widget
        </button>

        <button>
            Wallpaper
        </button>

        <button>
            Theme
        </button>

    </div>

    <div id="snap-line"></div>

    <div id="snap-line-horizontal"></div>

    <div id="gap-guide"></div>

    <div id="dashboard">

        <div
            class="widget"
            id="weather-hour-widget"
        >

            <div
                class="drag-handle"
                id="weather-hour-drag-handle"
            >

                <span class="drag-dot"></span>
                <span class="drag-dot"></span>
                <span class="drag-dot"></span>

                <span class="drag-dot"></span>
                <span class="drag-dot"></span>
                <span class="drag-dot"></span>

            </div>

            <div class="widget-header">

                <span>
                    Weather Hour
                </span>

                <button
                    class="widget-settings"
                >
                    ⚙
                </button>

            </div>

            <div class="widget-content">

                Test Widget

            </div>

            <div class="resize-handle">

                ↘

            </div>

        </div>

    </div>

    <script
        type="module"
        src="js/main.js"
    ></script>

</body>

</html>
