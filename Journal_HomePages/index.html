<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Journal Homepage
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap"
    >

    <link
        rel="stylesheet"
        href="/journal_home_static/css/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="/journal_home_static/css/widget.css"
    >

    <link
        rel="stylesheet"
        href="/journal_home_static/css/settings.css"
    >

</head>

<body>

    <div id="homepage-toolbar">

        <button
            id="homepage-settings"
        >
            ⚙ Customize Homepage
        </button>

    </div>

    <div id="homepage-menu">

        <button
            id="edit-layout-btn"
        >
            Edit Layout
        </button>

        <button>
            Add Widget
        </button>

        <button>
            Wallpaper
        </button>

        <button>
            Theme
        </button>

        <div id="homepage-menu-divider"></div>

        <button
            id="reset-layout-btn"
        >
            Reset Layout
        </button>

    </div>

    <div id="snap-line"></div>

    <div id="snap-line-horizontal"></div>

    <div id="gap-guide"></div>

    <div id="dashboard"></div>

    <script
        src="https://cdn.jsdelivr.net/npm/chart.js"
    ></script>

    <script
        type="module"
        src="/journal_home_static/js/main.js"
    ></script>

</body>

</html>
