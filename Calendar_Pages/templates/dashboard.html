<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/calendar_static/dashboard.css">
</head>

<body>

<div class="dashboard">

<!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo-section">

            <div class="logo-box"></div>

            <div class="logo-text">Life Pages</div>

        </div>

        <div class="nav-links">

            <a href="/dashboard" class="active">Home</a>

            <a href="/finance">Finance Page</a>

            <a href="/diary">Diary Page</a>

            <a href="/calendar">Calendar Page</a>

            <a href="/logout">Logout</a>
        </div>

        <div class="profile"></div>

    </nav>

<!-- ================= HERO ================= -->

    <section class="hero">

        <h1>Hello!</h1>

        <p>
            Let's make today a productive and beautiful day.
        </p>

    </section>

<!-- ================= CARDS ================= -->

    <section class="cards-container">

        <!-- FINANCE -->

        <div class="card">

            <div class="card-top">

                <div class="card-left">

                    <div class="icon-box"></div>

                    <div class="card-text">

                        <h2>Finance</h2>

                        <p>
                            Track your income and expenses easily.
                        </p>

                    </div>

                </div>

                <span>⋮</span>

            </div>

            <div class="preview-box"></div>

           <button class="card-btn" onclick="window.location.href='/add'">Go to Finance</button>

        </div>

        <!-- DIARY -->

        <div class="card">

            <div class="card-top">

                <div class="card-left">

                    <div class="icon-box"></div>

                    <div class="card-text">

                        <h2>Diary</h2>

                        <p>
                            Write your thoughts and cherish your memories.
                        </p>

                    </div>

                </div>

                <span>⋮</span>

            </div>

            <div class="preview-box"></div>

            <button class="card-btn" onclick="window.location.href='/diary'">Go to Diary</button>

        </div>

        <!-- CALENDAR -->

        <div class="card">

            <div class="card-top">

                <div class="card-left">

                    <div class="icon-box"></div>

                    <div class="card-text">

                        <h2>Calendar</h2>

                        <p>
                            Plan your schedule and never miss a thing.
                        </p>

                    </div>

                </div>

                <span>⋮</span>

            </div>

            <div class="preview-box"></div>

            <button class="card-btn" onclick="window.location.href='/calendar'">Go to Calendar</button>

        </div>

    </section>

<!-- ================= MUSIC SECTION ================= -->

<section class="music-section">

    <div class="music-left">

        <!-- VINYL -->

        <div class="vinyl-container">

            <div class="vinyl">

                <!-- CENTER LOGO PLACEHOLDER -->

                <div class="vinyl-center"></div>

            </div>

            <!-- FLOATING MUSIC NOTES -->

            <div class="music-notes">

                <span class="note note1">♪</span>

                <span class="note note2">♫</span>

                <span class="note note3">♪</span>

            </div>

        </div>

    </div>

</section>


<script>
// Select important elements from the DOM
const upload     = document.getElementById("musicUpload");   // File upload input
const audio      = document.getElementById("audioPlayer");   // Audio player element
const vinyl      = document.getElementById("vinyl");         // Vinyl record animation element
const songTitle  = document.getElementById("songTitle");     // Song title display

/* ================= MP3 UPLOAD ================= */
// Handle MP3 file upload
upload.addEventListener("change", function() {
    const file = this.files[0];                    // Get the selected file
    
    if (file) {
        const musicURL = URL.createObjectURL(file); // Create temporary URL for the file
        audio.src = musicURL;                       // Load the music into the audio player
        songTitle.textContent = file.name;          // Show the file name
    }
});

/* ================= PLAY & PAUSE CONTROLS ================= */
// Play the music
function playMusic() {
    audio.play();                    // Start playback
    vinyl.classList.add("playing");  // Start vinyl spinning animation
}

// Pause the music
function pauseMusic() {
    audio.pause();                     // Pause playback
    vinyl.classList.remove("playing"); // Stop vinyl spinning animation
} 
</script>

</body>
</html>
