<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <style>
    .error { color: red; }
    .success { color: green; }
    </style>
    <link rel="stylesheet" href="/shared_static/page-transitions.css">
</head>

<body>

<!-- NAV -->
<a href="/login">Login</a> |
<a href="/register">Sign Up</a>

<hr>

<h2>SIGN UP</h2>

<form method="POST">

    <!-- USERNAME -->
    <label>Username:</label><br>
    <input type="text" name="username" required autocomplete="username"><br><br>

    <!-- EMAIL -->
    <label>Email:</label><br>
    <input type="email" name="email" required autocomplete="email"><br><br>

    <!-- PASSWORD -->
    <label>Password:</label><br>
    <input type="password" name="password" required autocomplete="new-password"><br>

    <p>Password must:</p>
    <ul>
        <li>Be at least 8 characters</li>
        <li>Contain at least 1 number</li>
        <li>Contain uppercase letter</li>
        <li>Contain lowercase letter</li>
    </ul>

    <!-- SECURITY QUESTION -->
    <label>Security Question:</label><br>
    <select name="question" required>
        <option value="">-- Select Security Question --</option>
        <option value="nickname">What is your nickname?</option>
        <option value="birth_city">Where is your birth city?</option>
        <option value="favourite_subject">What is your favourite subject?</option>
        <option value="mother_name">What is your mother's name?</option>
        <option value="best_friend">What is your best friend's name?</option>
    </select><br><br>

    <!-- ANSWER -->
    <label>Answer:</label><br>
    <input type="text" name="answer" required><br><br>

    <button type="submit">Register</button>

</form>

<!-- ERROR -->
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<!-- SUCCESS -->
{% if request.args.get("success") %}
<p class="success">{{ request.args.get("success") }}</p>
{% endif %}

    <script src="/shared_static/page-transitions.js" defer></script>
</body>
</html>
