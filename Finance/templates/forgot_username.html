<!DOCTYPE html>
<html>
<head>
<title>Life Pages</title>
<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- ICON -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<!-- MAIN CONTAINER -->
<div class="container">

    <!-- LEFT PANEL -->
    <div class="left-panel">

        <h1>Recover your username</h1>

        <p>Remember it?</p>

        <a href="/login" class="register-btn">Back to Login</a>

    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">

        <h2>Forgot Username</h2>

        <form action="/forgot_username" method="POST">

            <!-- EMAIL -->
            <div class="input-box">

                <i class="fa-regular fa-envelope"></i>

                <input
                 type="email"
                 name="email"
                 placeholder="Email"
                 required
                 autocomplete="email">

            </div>

            <button type="submit">Find Username</button>

        </form>

        <!-- ERROR -->
        {% if error %}
        <p class="error-message">{{ error }}</p>
        {% endif %}

        <!-- SUCCESS -->
        {% if result %}
        <p class="success-message">Your username is: {{ result }}</p>
        {% endif %}

    </div>

</div>

</body>
</html>
