<!DOCTYPE html>
<html>
<head>
    <title>Life Pages</title>
</head>

<body>

<!-- NAV -->
<a href="/login">Login</a> |
<a href="/register">Register</a>

<hr>

<h1>Life Pages</h1>
<p>Recover your username</p>

<h3>Forgot Username</h3>

<form method="POST">

    <!-- EMAIL -->
    <label>Email:</label><br>
    <input type="email" name="email" required autocomplete="email"><br><br>

    <button type="submit">Find Username</button>

</form>

<br>
<a href="/login">Back to Login</a>

<!-- ERROR -->
{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<!-- SUCCESS -->
{% if result %}
<p style="color:green;">Your username is: {{ result }}</p>
{% endif %}

</body>
</html>
