<!DOCTYPE html>
<html>
<head>
    <title>Life Pages</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style2.css') }}">
</head>

<body>
<hr>
<a href="/view">Finance</a> |
<a href="/diary">Diary</a> |
<a href="/calendar">Calendar</a> |
<a href="/logout">Logout</a>
</hr>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">

        <div class="logo">
            Life Pages
        </div>

        <div class="menu-item active" onclick="showPage('today', this)">Today</div>

        <div class="section-title">To-Do Lists</div>
        <div class="menu-item" onclick="showPage('work', this)">Work Tasks</div>
        <div class="menu-item" onclick="showPage('shopping', this)">Shopping List</div>
        <div class="menu-item" onclick="showPage('study', this)">Study Plan</div>
        <div class="menu-item" onclick="showPage('personal', this)">Personal Memos</div>
        <div class="menu-item" onclick="showPage('workout', this)">Workout Plan</div>

        <div class="section-title">Calendar</div>
        <div class="menu-item" onclick="showPage('calendar', this)">Calendar</div>

        <div class="section-title">Special</div>
        <div class="menu-item" onclick="showPage('countdown', this)">Countdown</div>

        <div class="section-title">Others</div>
        <div class="menu-item" onclick="showPage('completed', this)">✔ Completed</div>
        <div class="menu-item" onclick="showPage('trash', this)">🗑 Trash</div>

    </div>

    <!-- Main Content -->
    <div class="main">

        <!-- Today -->
        <div id="today" class="page active">
            <h2>Today</h2>
            <p id="date"></p>

            <h3>Today Tasks</h3>
            <ul id="todayTasks"></ul>

    <!-- ===== TASK VIEW ===== -->
    <div id="taskView" class="view" style="display:none;">


    <!-- 左边 Task Section -->
    <div style="width: 60%; float:left;">

        <!-- Header -->
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 id="listTitle">Study Plan</h2>

            <!-- Toggle Completed -->
            <button id="toggleCompletedBtn" onclick="toggleCompleted()">
                隐藏已完成
            </button>
        </div>
      
             <!-- Add Task -->
        <div style="margin:10px 0;">
            <input id="taskInput" placeholder="Add a task..." style="width:70%;">
            <button onclick="addTask()">Add</button>
        </div>

        <!-- Active Tasks -->
        <div id="taskList"></div>

         <!-- Completed Section -->
        <div id="completedSection" style="margin-top:20px;">
            <h4>已完成 (<span id="completedCount">0</span>)</h4>
            <div id="completedList"></div>
        </div>

    </div>

    <!-- 右边 Detail Panel -->
     <div id="taskDetailPanel" style="width:35%; float:right; display:none; border-left:1px solid #ccc; padding-left:20px;">
        <h3 id="detailTitle"></h3>
        <p id="detailDate"></p>
        <p id="detailTime"></p>
    </div>

</div>

    <div id="calendarView" style="display:none;">

    <!-- Top Bar -->
    <div class="calendar-top">

    <div class="calendar-header">
        <button onclick="prevMonth()">❮</button>
        <h2 id="monthTitle"></h2>
        <button onclick="nextMonth()">❯</button>
    </div>

    <div class="view-buttons">
        <button onclick="setView('month')">Month View</button>
        <button onclick="setView('year')">Year View</button>
    </div>

</div>

<!-- Month View -->
<div id="monthView">

    <div class="calendar">

        <div class="weekdays">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>

        <div id="calendarDays" class="days"></div>

    </div>

</div>

<!-- Year View -->
<div id="yearView" style="display:none;">

    <!-- Change Year -->
    <div class="year-header">
        <button onclick="prevYear()">❮</button>
        <h2 id="yearTitle"></h2>
        <button onclick="nextYear()">❯</button>
    </div>

    <div id="yearGrid"></div>

</div>

</div>   
<!-- ===== JavaScript File ===== -->
<script src="{{ url_for('static', filename='calendar.js') }}"></script>
<script src="{{ url_for('static', filename='task.js') }}"></script>

<script>
function showView(view, element) {
    // 隐藏全部
    document.getElementById("todayView").style.display = "none";
    document.getElementById("calendarView").style.display = "none";

    // 显示当前
    document.getElementById(view).style.display = "block";

    // active 切换
    let items = document.querySelectorAll(".menu-item");
    items.forEach(item => item.classList.remove("active"));
    element.classList.add("active");
}

// 默认显示 Today
window.onload = function() {
    showView("todayView", document.querySelector(".menu-item"));
};
</script>

</body>
</html>
