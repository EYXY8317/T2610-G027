<!DOCTYPE html>
<html>
<head>
<title>Life Pages</title>
<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- ICON -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<!-- MAIN CONTAINER -->
<div class="container">

    <!-- LEFT PANEL -->
    <div class="left-panel">

        <h1>Recover your password</h1>

        <p>Remember it?</p>

        <a href="/login" class="register-btn">Back to Login</a>

    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">

        <h2>Forgot Password</h2>

        <form action="/forgot" method="POST">

            <!-- USERNAME -->
            <div class="input-box">

                <i class="fa-regular fa-user"></i>

                <input
                 type="text"
                 name="username"
                 placeholder="Username"
                 required
                 autocomplete="username">

            </div>

            <!-- SECURITY QUESTION -->
            <div class="input-box">

                <i class="fa-solid fa-circle-question"></i>

                <select name="question" required>

                    <option value="">Security Question</option>

                    <option value="nickname">What is your nickname?</option>

                    <option value="birth_city">Where is your birth city?</option>

                    <option value="favourite_subject">What is your favourite subject?</option>

                    <option value="mother_name">What is your mother's name?</option>

                    <option value="best_friend">What is your best friend's name?</option>

                </select>

            </div>

            <!-- ANSWER -->
            <div class="input-box">

                <i class="fa-regular fa-comment"></i>

                <input
                 type="text"
                 name="answer"
                 placeholder="Answer"
                 required>

            </div>

            <button type="submit">Verify</button>

        </form>

        <!-- ERROR -->
        {% if error %}
        <p class="error-message">{{ error }}</p>
        {% endif %}

        <!-- SUCCESS -->
        {% if success %}
        <p class="success-message">{{ success }}</p>
        {% endif %}

    </div>

</div>

</body>
</html>
