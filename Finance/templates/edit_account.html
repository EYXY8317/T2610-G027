<!DOCTYPE html>
<html>
<head>
    <meta name="logged-in" content="{{ 'true' if logged_in else 'false' }}">
    <title>Edit Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='finance.css') }}">
    <link rel="stylesheet" href="{{ url_for('profile_static', filename='profile.css') }}">
    <script src="/calendar_static/themecolor.js"></script>
    <script src="{{ url_for('static', filename='login-gate.js') }}"></script>
    <script id="theme-data" type="application/json">{{ (user.theme if user and user.theme else 'mocha') | tojson }}</script>
    <script>
    (function(){
        var theme = JSON.parse(document.getElementById('theme-data').textContent);
        setTheme(theme);
    })();
    </script>
    <link rel="stylesheet" href="/shared_static/page-transitions.css">
</head>

<body
class="{{ user.theme if user and user.theme else 'adaptive' }} {{ user.ui_style if user and user.ui_style else 'premium' }}"
>


<nav class="navbar">
    <div class="logo-section">
        <div class="logo-box">
            <img src="/calendar_static/images/LifePages.png" alt="Life Pages">
        </div>
        <div class="logo-text">Life Pages</div>
    </div>
    <div class="nav-links">
        <a href="/dashboard">Home</a>
        <a href="/today">Today</a>
        <a href="/finance" class="active">Finance Page</a>
        <a href="/diary_homepage">Diary Page</a>
        <a href="/calendar">Calendar Page</a>
        <a href="/profile">Settings</a>
    </div>
</nav>

<div class="topbar">
    <div class="topbar-title">🏦 Accounts</div>
    <div class="topbar-links">
        <a href="/finance">Dashboard</a>
        <a href="/view">View</a>
        <a href="/add">Add</a>
        <a href="/summary">Summary</a>
        <a href="/budget">Budget</a>
        <a href="/goals">Goals</a>
        <a href="/accounts" class="active-link">Accounts</a>
    </div>
</div>

<div class="summary-wrapper">
    <div class="summary-card hover-card">

        <div class="page-header">
            <h1 class="summary-main-title">✏️ Edit Account</h1>
            <p class="add-subtitle">Update the name or purpose of this account. All linked transactions will be updated automatically.</p>
        </div>

        {% if error %}
        <div class="insight-box" style="margin-bottom:16px;">
            <p class="negative">{{ error }}</p>
        </div>
        {% endif %}

        <form method="POST" class="add-form">
            <div class="form-grid">
                <div class="form-group">
                    <label>Account Name</label>
                    <input type="text" name="name" value="{{ account.name }}" required>
                </div>
                <div class="form-group">
                    <label>Purpose</label>
                    <select name="purpose">
                        <option value="spending" {% if account.purpose == 'spending' %}selected{% endif %}>💳 Spending Account</option>
                        <option value="savings"  {% if account.purpose == 'savings'  %}selected{% endif %}>🏦 Savings Account</option>
                    </select>
                </div>
            </div>
            <div class="action-buttons" style="margin-top:16px;">
                <button type="submit" class="primary-btn">Save Changes</button>
                <a href="/accounts" class="secondary-btn">Cancel</a>
            </div>
        </form>

    </div>
</div>

    <script src="/shared_static/page-transitions.js" defer></script>
</body>
</html>
