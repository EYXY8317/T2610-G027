<!DOCTYPE html>

<html>

<head>

<meta name="logged-in" content="{{ 'true' if logged_in else 'false' }}">
    <title>Edit Budget</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='finance.css') }}"
>

<link
    rel="stylesheet"
    href="{{ url_for('profile_static', filename='profile.css') }}"
>

<script src="/calendar_static/themecolor.js"></script>
    <script src="{{ url_for('static', filename='login-gate.js') }}"></script>
<script id="theme-data" type="application/json">{{ (user.theme if user and user.theme else 'mocha') | tojson }}</script>
<script>
(function(){
    var theme = JSON.parse(document.getElementById('theme-data').textContent);
    setTheme(theme);
})();
</script>

    <link rel="stylesheet" href="/shared_static/page-transitions.css">
</head>

<body
class="{{ user.theme if user else 'adaptive' }}"
>

<nav class="navbar">
    <div class="logo-section">
        <div class="logo-box">
            <img src="/calendar_static/images/LifePages.png" alt="Life Pages">
        </div>
        <div class="logo-text">Life Pages</div>
    </div>
    <div class="nav-links">
        <a href="/dashboard">Home</a>
        <a href="/today">Today</a>
        <a href="/finance" class="active">Finance Page</a>
        <a href="/diary_homepage">Diary Page</a>
        <a href="/calendar">Calendar Page</a>
        <a href="/profile">Settings</a>
    </div>
</nav>

<nav class="navbar">
    <div class="logo-section">
        <div class="logo-box">
            <img src="/calendar_static/images/LifePages.png" alt="Life Pages">
        </div>
        <div class="logo-text">Life Pages</div>
    </div>
    <div class="nav-links">
        <a href="/dashboard">Home</a>
        <a href="/today">Today</a>
        <a href="/finance" class="active">Finance Page</a>
        <a href="/diary_homepage">Diary Page</a>
        <a href="/calendar">Calendar Page</a>
        <a href="/profile">Settings</a>
    </div>
</nav>

<!-- ================= TOPBAR ================= -->

<div class="topbar">

    <div class="topbar-title">
        💰 Budget Tracking
    </div>

    <div class="topbar-links">
        <a href="/finance">Dashboard</a>
        <a href="/view">View</a>
        <a href="/add">Add</a>
        <a href="/summary">Summary</a>
        <a href="/budget" class="active-link">Budget</a>
        <a href="/goals">Goals</a>
        <a href="/accounts">Accounts</a>
    </div>

</div>

<!-- ================= MAIN ================= -->

<div class="summary-wrapper">

<div class="summary-card">

    <div class="page-header">

        <h1>💰 Edit Financial Budget</h1>

        <p>
            Update your spending limit for this category.
        </p>

    </div>

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">

                <label>
                    Category
                </label>

                <input
                    type="text"
                    value="{{ budget.category }}"
                    readonly
                >

            </div>

            <div class="form-group">

                <label>
                    Budget Amount (RM)
                </label>

                <input
                    type="number"
                    name="amount"
                    value="{{ budget.amount }}"
                    class="goal-amount-input"
                    placeholder="0.00"
                    step="0.01"
                    min="0.01"
                    required
                >

            </div>

            <div class="form-group">

                <label>Budget Period</label>

                <select name="period">
                    <option value="monthly" {% if budget.period == 'monthly' or not budget.period %}selected{% endif %}>📅 Monthly</option>
                    <option value="weekly" {% if budget.period == 'weekly' %}selected{% endif %}>📅 Weekly</option>
                    <option value="yearly" {% if budget.period == 'yearly' %}selected{% endif %}>📅 Yearly</option>
                </select>

            </div>

        </div>

        <div class="action-buttons">

            <button
                type="submit"
                class="primary-btn"
            >
                Save Changes
            </button>

            <a
                href="/budget"
                class="secondary-btn"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

</div>

    <script src="/shared_static/page-transitions.js" defer></script>
</body>
</html>
