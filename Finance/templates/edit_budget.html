<!DOCTYPE html>

<html>

<head>

<title>Edit Budget</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='finance.css') }}"
>

<link
    rel="stylesheet"
    href="{{ url_for('profile_static', filename='profile.css') }}"
>

</head>

<body
class="{{ user.theme if user else 'adaptive' }}"

{% if wallpaper %}
style="
background-image:
url('/profile_static/wallpapers/{{ wallpaper }}');
"
{% endif %}

>

<div class="wallpaper-overlay"></div>

<nav class="navbar">
    <div class="logo-section">
        <div class="logo-box">
            <img src="/calendar_static/images/LifePages.png" alt="Life Pages">
        </div>
        <div class="logo-text">Life Pages</div>
    </div>
    <div class="nav-links">
        <a href="/dashboard">Home</a>
        <a href="/finance" class="active">Finance Page</a>
        <a href="/journal">Diary Page</a>
        <a href="/calendar">Calendar Page</a>
        <a href="/profile">Settings</a>
    </div>
</nav>

<!-- ================= TOPBAR ================= -->

<div class="topbar">

    <div class="topbar-title">
        💰 Budget Tracking
    </div>

    <div class="topbar-links">
        <a href="/finance">Dashboard</a>
        <a href="/view">View</a>
        <a href="/add">Add</a>
        <a href="/summary">Summary</a>
        <a href="/budget" class="active-link">Budget</a>
        <a href="/goals">Goals</a>
    </div>

</div>

<!-- ================= MAIN ================= -->

<div class="summary-wrapper">

<div class="summary-card">

    <div class="page-header">

        <h1>💰 Edit Financial Budget</h1>

        <p>
            Update your spending limit for this category.
        </p>

    </div>

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">

                <label>
                    Category
                </label>

                <input
                    type="text"
                    value="{{ budget.category }}"
                    readonly
                >

            </div>

            <div class="form-group">

                <label>
                    Budget Amount (RM)
                </label>

                <input
                    type="number"
                    name="amount"
                    value="{{ budget.amount }}"
                    class="goal-amount-input"
                    placeholder="0.00"
                    step="0.01"
                    min="0.01"
                    required
                >

            </div>

        </div>

        <div class="action-buttons">

            <button
                type="submit"
                class="primary-btn"
            >
                Save Changes
            </button>

            <a
                href="/budget"
                class="secondary-btn"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

</div>

</body>
</html>
