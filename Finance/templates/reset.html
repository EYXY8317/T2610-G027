<!DOCTYPE html>
<html>
<head>
<title>Life Pages</title>
<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- ICON -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="/shared_static/page-transitions.css">
</head>

<body>

<!-- MAIN CONTAINER / 主容器 -->
<div class="container">

    <!-- LEFT PANEL / 左侧面板 -->
    <div class="left-panel">

        <h1>Create a new password</h1>

        <p>Remember it?</p>

        <a href="/login" class="register-btn">Back to Login</a>

    </div>

    <!-- RIGHT PANEL / 右侧面板 -->
    <div class="right-panel">

        <h2>Reset Password</h2>

        <p class="user-display">Resetting for: <b>{{ username }}</b></p>

        <form action="/reset" method="POST">

            <!-- NEW PASSWORD -->
            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                 type="password"
                 id="newPassword"
                 name="password"
                 placeholder="New Password"
                 required
                 autocomplete="new-password">

                <span
                 id="newEye"
                 class="toggle-eye"
                 onclick="togglePassword('newPassword','newEye')">

                 🙈

                </span>

            </div>

            <div class="password-rules">
              Password: 8+ chars • Uppercase • Lowercase • Number
            </div>

            <button type="submit">Reset Password</button>

        </form>

        <!-- ERROR -->
        {% if error %}
        <p class="error-message">{{ error }}</p>
        {% endif %}

        <!-- SUCCESS -->
        {% if success %}
        <p class="success-message">{{ success }}</p>
        {% endif %}

    </div>

</div>

<script>
// 点击眼睛图标切换密码框是"显示明文"还是"隐藏成圆点"——
// input.type 在 "password"（自动隐藏）和 "text"（明文显示）之间切换，
// 同时把眼睛图标换成对应的睁眼/闭眼表情，给用户一个视觉提示。
// Clicking the eye icon toggles the password field between "hidden as
// dots" and "shown as plain text" — input.type switches between
// "password" (auto-masked) and "text" (visible), and the eye emoji swaps
// to match, giving the user a visual cue of the current state.

function togglePassword(inputId, eyeId) {
    const input = document.getElementById(inputId);
    const eye = document.getElementById(eyeId);
    if (input.type === "password") {
        input.type = "text";
        eye.textContent = "🙉";
    } else {
        input.type = "password";
        eye.textContent = "🙈";
    }
}
</script>

    <script src="/shared_static/page-transitions.js" defer></script>
</body>
</html>
