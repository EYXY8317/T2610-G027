<!DOCTYPE html>
<html>

<head>

    <title>Edit Goal</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='finance.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('profile_static', filename='profile.css') }}"
    >

</head>

<body
class="{{ user.theme if user else 'adaptive' }}"

{% if wallpaper %}
style="
background-image:
url('/profile_static/wallpapers/{{ wallpaper }}');
"
{% endif %}
>

<div class="wallpaper-overlay"></div>

<!-- ================= TOPBAR ================= -->

<div class="topbar">

    <div class="topbar-title">
        🎯 Goals
    </div>

    <div class="topbar-links">
        <a href="/finance">Dashboard</a>
        <a href="/view">View</a>
        <a href="/add">Add</a>
        <a href="/summary">Summary</a>
        <a href="/budget">Budget</a>
        <a href="/goals" class="active-link">Goals</a>
    </div>

    <div class="topbar-actions">
        <a href="/dashboard">Home</a>
        <a href="/calendar">Calendar</a>
        <a href="/diary">Diary</a>
        <a href="/profile">Profile</a>
        <a href="/logout">Logout</a>
    </div>

</div>

<!-- ================= MAIN ================= -->

<div class="summary-wrapper">

    <div class="summary-card">

        <div class="page-header">

            <h1>🎯 Edit Financial Goal</h1>

            <p>
                Update your savings target and goal details.
            </p>

        </div>

        <form method="POST">

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Goal Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        value="{{ goal.name }}"
                        required
                    >

                </div>

                    <div class="form-group">

                        <label>
                            Target Amount (RM)
                        </label>

                        <input
                            type="number"
                            name="target"
                            value="{{ goal.target }}"
                            class="goal-amount-input"
                            placeholder="0.00"
                            step="0.01"
                            min="0.01"
                            required
                        >

                    </div>

                </div>

            </div>

            <div class="action-buttons">

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Save Changes
                </button>

                <a
                    href="/goals"
                    class="secondary-btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
