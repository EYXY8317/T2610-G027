<!DOCTYPE html>
<html>

<head>

    <title>Edit Goal</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='finance.css') }}"
    >

</head>

<body
class="{{ user.theme if user else 'adaptive' }}"

{% if wallpaper %}

style="
background-image:
url('/profile_static/wallpapers/{{ wallpaper }}');
"

{% endif %}
>

<div class="wallpaper-overlay"></div>

<!-- ================= TOPBAR ================= -->

<div class="topbar">

    <div class="topbar-title">
        ✏️ Edit Goal
    </div>

    <div class="topbar-links">

        <a href="/view">View</a>

        <a href="/add">Add</a>

        <a href="/summary">Summary</a>

        <a href="/budget">Budget</a>

        <a
            href="/goals"
            class="active-link"
        >
            Goals
        </a>

    </div>

    <div class="topbar-actions">

        <a href="/calendar">Calendar</a>

        <a href="/diary">Diary</a>

        <a href="/profile">Profile</a>

        <a href="/logout">Logout</a>

    </div>

</div>

<!-- ================= CONTENT ================= -->

<div class="page-container">

    <div class="summary-card edit-goal">

        <div class="page-header">

            <h1>Edit Goal</h1>

            <!-- <p>Theme = {{ user.theme }}</p> -->

            <p>
                Update your financial goal.
            </p>

        </div>

        <form method="POST">

            <div class="form-group">

                <label>
                    Goal Name
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ goal.name }}"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Target Amount (RM)
                </label>

                <input
                    type="number"
                    name="target"
                    value="{{ goal.target }}"
                    step="0.01"
                    required
                >

            </div>

            <div class="action-buttons">

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Save Changes
                </button>

                <a
                    href="/goals"
                    class="secondary-btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
