<!DOCTYPE html>
<html>

<head>

    <meta name="logged-in" content="{{ 'true' if logged_in else 'false' }}">
    <title>Edit Goal</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='finance.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('profile_static', filename='profile.css') }}"
    >

    <script src="/calendar_static/themecolor.js"></script>
    <script src="{{ url_for('static', filename='login-gate.js') }}"></script>
    <script>
    (function(){ setTheme({{ (user.theme if user and user.theme else 'mocha') | tojson }}); })();
    </script>

    <link rel="stylesheet" href="/shared_static/page-transitions.css">
</head>

<body
class="{{ user.theme if user else 'adaptive' }}"
>

<nav class="navbar">
    <div class="logo-section">
        <div class="logo-box">
            <img src="/calendar_static/images/LifePages.png" alt="Life Pages">
        </div>
        <div class="logo-text">Life Pages</div>
    </div>
    <div class="nav-links">
        <a href="/dashboard">Home</a>
        <a href="/today">Today</a>
        <a href="/finance" class="active">Finance Page</a>
        <a href="/diary_homepage">Diary Page</a>
        <a href="/calendar">Calendar Page</a>
        <a href="/profile">Settings</a>
    </div>
</nav>

<nav class="navbar">
    <div class="logo-section">
        <div class="logo-box">
            <img src="/calendar_static/images/LifePages.png" alt="Life Pages">
        </div>
        <div class="logo-text">Life Pages</div>
    </div>
    <div class="nav-links">
        <a href="/dashboard">Home</a>
        <a href="/today">Today</a>
        <a href="/finance" class="active">Finance Page</a>
        <a href="/diary_homepage">Diary Page</a>
        <a href="/calendar">Calendar Page</a>
        <a href="/profile">Settings</a>
    </div>
</nav>

<!-- ================= TOPBAR ================= -->

<div class="topbar">

    <div class="topbar-title">
        🎯 Goals
    </div>

    <div class="topbar-links">
        <a href="/finance">Dashboard</a>
        <a href="/view">View</a>
        <a href="/add">Add</a>
        <a href="/summary">Summary</a>
        <a href="/budget">Budget</a>
        <a href="/goals" class="active-link">Goals</a>
        <a href="/accounts">Accounts</a>
    </div>

</div>

<!-- ================= MAIN ================= -->

<div class="summary-wrapper">

    <div class="summary-card">

        <div class="page-header">

            <h1>🎯 Edit Financial Goal</h1>

            <p>
                Update your savings target and goal details.
            </p>

        </div>

        <form method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>Goal Name</label>
                    <input type="text" name="name" value="{{ goal.name }}" required>
                </div>

                <div class="form-group">
                    <label>Target Amount (RM)</label>
                    <input type="number" name="target" value="{{ goal.target }}" class="goal-amount-input" placeholder="0.00" step="0.01" min="0.01" required>
                </div>

                <div class="form-group">
                    <label>Target Date (Optional)</label>
                    <input type="date" name="target_date" value="{{ goal.target_date or '' }}">
                </div>

                <div class="form-group">
                    <label>Priority</label>
                    <select name="priority">
                        <option value="high" {% if goal.priority == 'high' %}selected{% endif %}>🔴 High</option>
                        <option value="medium" {% if goal.priority == 'medium' or not goal.priority %}selected{% endif %}>🟡 Medium</option>
                        <option value="low" {% if goal.priority == 'low' %}selected{% endif %}>🟢 Low</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select name="status">
                        <option value="In Progress" {% if goal.status == 'In Progress' or not goal.status %}selected{% endif %}>🚀 In Progress</option>
                        <option value="Paused" {% if goal.status == 'Paused' %}selected{% endif %}>⏸ Paused</option>
                        <option value="Cancelled" {% if goal.status == 'Cancelled' %}selected{% endif %}>❌ Cancelled</option>
                        <option value="Completed" {% if goal.status == 'Completed' %}selected{% endif %}>🎉 Completed</option>
                    </select>
                </div>

            </div>

            <div class="form-group" style="margin-top:12px;">
                <label>Notes (Optional)</label>
                <textarea
                    name="notes"
                    rows="2"
                    placeholder="Example: Flight + Hotel + Food"
                    style="resize:none;"
                >{{ goal.notes or '' }}</textarea>
            </div>

            <div class="action-buttons" style="margin-top:16px;">

                <button type="submit" class="primary-btn">Save Changes</button>

                <a href="/goals" class="secondary-btn">Cancel</a>

            </div>

        </form>

    </div>

</div>

    <script src="/shared_static/page-transitions.js" defer></script>
</body>
</html>
