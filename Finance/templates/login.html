<!DOCTYPE html>
<html>
<head>
<title>Life Pages</title>
<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- ICON -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<!-- MAIN CONTAINER -->
<div class="container">

    <!-- LEFT PANEL -->
    <div class="left-panel">

        <img src="/calendar_static/logo.png" class="logo">

        <h1>Log in to organize every page of your life!</h1>

        <p>Don't have an account?</p>

        <a href="/register" class="register-btn">
            Register
        </a>

    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">

        <h2>Login</h2>

        <!-- LOGIN FORM -->
        <form method="POST">

            <!-- USERNAME -->
            <div class="input-box">

                <i class="fa-regular fa-user"></i>

                <input type="text" name="username" placeholder="Username" required autocomplete="username">

            </div>

            <!-- PASSWORD -->
            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input type="password" id="password"
                name="password"
                placeholder="Password"
                required
                autocomplete="current-password">

                <span id="eye" class="toggle-eye" onclick="togglePassword()">🙈</span>

            </div>

           <div class="forgot-links">

            <a href="/forgot" class="forgot">
               Forgot Password?
            </a>

            <a href="/forgot_username" class="forgot-username">
               Forgot Username?
            </a>

        </div>

        <button type="submit">
                Login
        </button>

</form>

        </div>

        <!-- ERROR -->
        {% if error %}
        <p class="error-message">{{ error }}</p>
        {% endif %}

        <!-- SUCCESS -->
        {% if request.args.get("success") %}
        <p class="success-message">{{ request.args.get("success") }}</p>
        {% endif %}

    </div>

</div>

<script>
function togglePassword() {
    const input = document.getElementById("password");
    const eye = document.getElementById("eye");

    if (input.type === "password") {
        input.type = "text";
        eye.textContent = "🙉";
    } else {
        input.type = "password";
        eye.textContent = "🙈";
    }
}
</script>

</body>
</html>
