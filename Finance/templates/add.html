<!DOCTYPE html>
<html>

<head>

    <title>Add Record</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='finance.css') }}">

</head>

<body

{% if wallpaper %}

style="
background-image:
url('/profile_static/wallpapers/{{ wallpaper }}');
"

{% endif %}

>

<div class="wallpaper-overlay"></div>

<div class="summary-wrapper">

    <!-- ===== TOPBAR ===== -->

    <div class="topbar">

        <div class="topbar-title">
            ➕ Add Record
        </div>

        <div class="topbar-links">

            <a href="/view">View</a>

            <a href="/add" class="active-link">
                Add
            </a>

            <a href="/summary">Summary</a>

            <a href="/budget">Budget</a>

            <a href="/goals">Goals</a>

        </div>

        <div class="topbar-actions">

            <a href="/calendar">Calendar</a>

            <a href="/diary">Diary</a>

            <a href="/profile">Profile</a>

            <a href="/logout">Logout</a>

        </div>

    </div>

    <!-- ===== ADD RECORD CARD ===== -->

    <div class="summary-card">

        <h2>Financial Record</h2>

        {% if error %}
        <p class="negative">{{ error }}</p>
        {% endif %}

        {% if success %}
        <p class="positive">{{ success }}</p>
        {% endif %}

        <form method="POST">

            <!-- DATE -->

            <label>Date</label>

            <input
                type="date"
                name="date"
                value="{{ form_data.date if form_data else '' }}"
                required
            >

            <!-- TYPE -->

            <label>Type</label>

            <select name="type" id="typeSelect" required>

                <option value="">
                    -- Select Type --
                </option>

                <option
                    value="income"
                    {{ 'selected' if form_data and form_data.type == 'income' else '' }}
                >
                    Income
                </option>

                <option
                    value="expense"
                    {{ 'selected' if form_data and form_data.type == 'expense' else '' }}
                >
                    Expense
                </option>

                <option
                    value="saving"
                    {{ 'selected' if form_data and form_data.type == 'saving' else '' }}
                >
                    Saving
                </option>

            </select>

            <!-- CATEGORY -->

            <label>Category</label>

            <select
                name="category"
                id="categorySelect"
                required
                data-selected="{{ form_data.category if form_data else '' }}"
            >

                <option value="">
                    -- Select Category --
                </option>

            </select>

            <!-- ACCOUNT -->

            <label>Account</label>

            <select name="account">

                <option value="">
                    -- Select Account --
                </option>

                {% for acc in accounts %}

                <option
                    value="{{ acc.name }}"
                    {% if form_data and form_data.account == acc.name %}selected{% endif %}
                >
                    {{ acc.name }}
                </option>

                {% endfor %}

            </select>

            <!-- NEW ACCOUNT -->

            <label>New Account (Optional)</label>

            <input
                type="text"
                name="new_account"
                value="{{ form_data.new_account if form_data else '' }}"
                placeholder="Create new account"
            >

            <!-- ITEM -->

            <label>Item</label>

            <input
                type="text"
                name="item"
                value="{{ form_data.item if form_data else '' }}"
                placeholder="Example: Lunch, Salary, Grab..."
            >

            <!-- AMOUNT -->

            <label>Amount (RM)</label>

            <input
                type="text"
                id="amountInput"
                name="amount"
                value="{{ form_data.amount if form_data else '0.00' }}"
                readonly
            >

            <button type="submit">

                Add Record

            </button>

        </form>

    </div>

</div>

<!-- ===== SAFE JSON ===== -->

<script id="categories-data" type="application/json">

{{ categories | tojson if categories else '{}' }}

</script>

<script>

document.addEventListener("DOMContentLoaded", function () {

    // ================= CATEGORY =================

    let categories = {};

    try {

        categories = JSON.parse(
            document.getElementById("categories-data").textContent
        );

    } catch {

        categories = {};
    }

    const typeSelect = document.getElementById("typeSelect");

    const categorySelect = document.getElementById("categorySelect");

    let selectedCategory =
        categorySelect.getAttribute("data-selected") || "";

    function updateCategory() {

        const type = typeSelect.value;

        categorySelect.innerHTML =
            '<option value="">-- Select Category --</option>';

        if (categories[type]) {

            categories[type].forEach(cat => {

                const option = document.createElement("option");

                option.value = cat;

                option.textContent = cat;

                if (cat === selectedCategory) {

                    option.selected = true;
                }

                categorySelect.appendChild(option);

            });
        }
    }

    function updateItemRequired() {

        const itemInput = document.querySelector("input[name='item']");

        const type = typeSelect.value;

        if (type === "expense") {

            itemInput.setAttribute("required", "required");

        } else {

            itemInput.removeAttribute("required");

        }
    }

    typeSelect.addEventListener("change", function () {

        selectedCategory = "";

        updateCategory();

        updateItemRequired();

    });

    updateCategory();

    updateItemRequired();


    // ================= TNG INPUT =================

    let value = 0;

    let active = false;

    const amountInput =
        document.getElementById("amountInput");

    value =
        Math.round(
            parseFloat(amountInput.value || "0") * 100
        ) || 0;

    amountInput.addEventListener("focus", () => active = true);

    amountInput.addEventListener("blur", () => active = false);

    document.addEventListener("keydown", function(e) {

        if (!active) return;

        if (e.key >= "0" && e.key <= "9") {

            value =
                value * 10 + parseInt(e.key);

        }

        else if (e.key === "Backspace") {

            value =
                Math.floor(value / 10);

        }

        else {

            return;
        }

        e.preventDefault();

        amountInput.value =
            (value / 100).toFixed(2);

    });

    amountInput.focus();

});

</script>

</body>
</html>
