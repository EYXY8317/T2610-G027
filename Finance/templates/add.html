<!DOCTYPE html>
<html>
<head>

    <title>Add Record</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='finance.css') }}">

</head>

<body>
<body

{% if wallpaper %}

style="
background-image:
url('/profile_static/wallpapers/{{ wallpaper }}');
"

{% endif %}

>

<div class="wallpaper-overlay"></div>

<div class="topbar">

    <div class="topbar-title">
        ➕ Add Record
    </div>

    <div class="topbar-links">
        <a href="/view">View</a>
        <a href="/add" class="active-link">
            Add</a>
        <a href="/summary">Summary</a>
        <a href="/budget">Budget</a>
        <a href="/goals"></a>
    </div>

    <div class="topbar-actions">
        <a href="/calendar">Calendar</a>
        <a href="/diary">Diary</a>
        <a href="/profile">Profile</a>
        <a href="/logout">Logout</a>
    </div>

</div>

<form method="POST">

    <!-- DATE -->
    <label>Date:</label><br>
    <input type="date" name="date"
        value="{{ form_data.date if form_data else '' }}" required><br><br>

    <!-- TYPE -->
    <label>Type:</label><br>
    <select name="type" id="typeSelect" required>
        <option value="">-- Select Type --</option>
        <option value="income" {{ 'selected' if form_data and form_data.type == 'income' else '' }}>Income</option>
        <option value="expense" {{ 'selected' if form_data and form_data.type == 'expense' else '' }}>Expense</option>
        <option value="saving" {{ 'selected' if form_data and form_data.type == 'saving' else '' }}>Saving</option>
    </select><br><br>

    <!-- CATEGORY -->
    <label>Category:</label><br>
    <select name="category" id="categorySelect" required
        data-selected="{{ form_data.category if form_data else '' }}">
        <option value="">-- Select Category --</option>
    </select><br><br>

    <!-- ACCOUNT -->
    <label>Account:</label><br>
    <select name="account">
        <option value="">-- Select Account --</option>
        {% for acc in accounts %}
        <option value="{{ acc.name }}"
            {% if form_data and form_data.account == acc.name %}selected{% endif %}>
            {{ acc.name }}
        </option>
        {% endfor %}
    </select><br><br>

    <input type="text" name="new_account"
        value="{{ form_data.new_account if form_data else '' }}"
        placeholder="Or create new account"><br><br>

    <!-- ITEM -->
    <label>Item:</label><br>
    <input type="text" name="item"
        value="{{ form_data.item if form_data else '' }}"><br><br>

    <!-- AMOUNT -->
    <label>Amount (RM):</label><br>
    <input type="text" id="amountInput" name="amount"
        value="{{ form_data.amount if form_data else '0.00' }}" readonly>

    <br><br>
    <button type="submit">Add</button>

</form>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

{% if success %}
<p style="color:green;">{{ success }}</p>
{% endif %}

<!-- SAFE JSON -->
<script id="categories-data" type="application/json">
    {{ categories | tojson if categories else '{}' }}
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    // ================= CATEGORY =================
    let categories = {};
    try {
        categories = JSON.parse(
            document.getElementById("categories-data").textContent
        );
    } catch {
        categories = {};
    }

    const typeSelect = document.getElementById("typeSelect");
    const categorySelect = document.getElementById("categorySelect");

    let selectedCategory = categorySelect.getAttribute("data-selected") || "";

    function updateCategory() {
        const type = typeSelect.value;

        categorySelect.innerHTML = '<option value="">-- Select Category --</option>';

        if (categories[type]) {
            categories[type].forEach(cat => {
                const option = document.createElement("option");
                option.value = cat;
                option.textContent = cat;

                if (cat === selectedCategory) {
                    option.selected = true;
                }

                categorySelect.appendChild(option);
            });
        }
    }

    typeSelect.addEventListener("change", function () {
        selectedCategory = ""; // reset when user changes type
        updateCategory();
    });

    updateCategory();


    // ================= TNG INPUT =================
    let value = 0;
    let active = false;

    const amountInput = document.getElementById("amountInput");

    // initialize safely
    value = Math.round(parseFloat(amountInput.value || "0") * 100) || 0;

    amountInput.addEventListener("focus", () => active = true);
    amountInput.addEventListener("blur", () => active = false);

    document.addEventListener("keydown", function(e) {

        if (!active) return;

        if (e.key >= "0" && e.key <= "9") {
            value = value * 10 + parseInt(e.key);
        } 
        else if (e.key === "Backspace") {
            value = Math.floor(value / 10);
        } 
        else {
            return;
        }

        e.preventDefault();
        amountInput.value = (value / 100).toFixed(2);
    });

    // optional focus
    amountInput.focus();

});
</script>

</body>
</html>
