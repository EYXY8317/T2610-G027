<!DOCTYPE html>
<html>
<head>
    <title>Update Record</title>
</head>

<body>
<body

{% if wallpaper %}

style="
background-image:
url('/profile_static/wallpapers/{{ wallpaper }}');
"

{% endif %}

>

<div class="wallpaper-overlay"></div>

<hr>
<a href="/view">View</a> |
<a href="/add">Add</a> |
<a href="/summary">Summary</a> |
<a href="/budget">Budget</a> |
<a href="/logout">Logout</a>
<hr>

<h1>Update Record</h1>

<form method="POST">

    <!-- DATE -->
    <label>Date:</label><br>
    <input type="date" name="date" value="{{ record.date }}" required><br><br>

    <!-- TYPE -->
    <label>Type:</label><br>
    <select name="type" id="typeSelect" required>
        <option value="income" {% if record.type=="income" %}selected{% endif %}>Income</option>
        <option value="expense" {% if record.type=="expense" %}selected{% endif %}>Expense</option>
        <option value="saving" {% if record.type=="saving" %}selected{% endif %}>Saving</option>
    </select><br><br>

    <!-- CATEGORY -->
    <label>Category:</label><br>
    <select name="category" id="categorySelect"></select><br><br>

    <!-- ACCOUNT -->
    <label>Account:</label><br>
    <select id="account" name="account">
        <option value="">-- Select Account --</option>

        {% for acc in accounts %}
            <option value="{{ acc.name }}"
            {{ "selected" if record.account == acc.name else "" }}>
                {{ acc.name }}
            </option>
        {% endfor %}

        <option value="__new__">➕ Create New Account</option>
    </select>

    <br><br>

    <!-- NEW ACCOUNT -->
    <input type="text" id="new_account" name="new_account"
    placeholder="Enter new account"
    style="display:none;">

    <!-- ITEM -->
    <label>Item:</label><br>
    <input type="text" name="item" value="{{ record.item }}"><br><br>

    <!-- AMOUNT -->
    <label>Amount (RM):</label><br>
    <input type="text" id="amountInput" name="amount"
        value="{{ record.amount }}" readonly required>

    <br><br>
    <button type="submit">Update</button>

</form>

<!-- MESSAGES -->
{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

{% if success %}
<p style="color:green;">{{ success }}</p>
{% endif %}

<br>
<a href="/view">Back</a>

<script>
document.addEventListener("DOMContentLoaded", function () {

    // ================= CATEGORY =================
    const categories = {
        income: ["Salary", "Freelance", "Business", "Gift", "Bonus"],
        expense: ["Food", "Transport", "Entertainment", "Rent", "Education", "Travel"],
        saving: ["Savings", "Investment", "Emergency Fund"]
    };

    const typeSelect = document.getElementById("typeSelect");
    const categorySelect = document.getElementById("categorySelect");

    const selectedCategory = "{{ record.category or '' }}";

    function loadCategories() {
        const type = typeSelect.value;

        categorySelect.innerHTML = '<option value="">-- Select Category --</option>';

        if (categories[type]) {
            categories[type].forEach(cat => {
                const option = document.createElement("option");
                option.value = cat;
                option.textContent = cat;

                if (cat === selectedCategory) {
                    option.selected = true;
                }

                categorySelect.appendChild(option);
            });
        }
    }

    typeSelect.addEventListener("change", loadCategories);

    loadCategories();


    // ================= ACCOUNT TOGGLE =================
    const accountSelect = document.getElementById("account");
    const newAccountInput = document.getElementById("new_account");

    function toggleNewAccount() {
        if (accountSelect.value === "__new__") {
            newAccountInput.style.display = "block";
        } else {
            newAccountInput.style.display = "none";
            newAccountInput.value = "";
        }
    }

    accountSelect.addEventListener("change", toggleNewAccount);
    toggleNewAccount();


    // ================= TNG INPUT =================
    let value = Math.round(parseFloat("{{ record.amount or 0 }}") * 100) || 0;
    let active = false;

    const amountInput = document.getElementById("amountInput");

    amountInput.addEventListener("focus", () => active = true);
    amountInput.addEventListener("blur", () => active = false);

    document.addEventListener("keydown", function(e) {

        if (!active) return;

        if (e.key >= "0" && e.key <= "9") {
            value = value * 10 + parseInt(e.key);
        } 
        else if (e.key === "Backspace") {
            value = Math.floor(value / 10);
        } 
        else {
            return;
        }

        e.preventDefault();
        amountInput.value = (value / 100).toFixed(2);
    });

});
</script>

</body>
</html>
