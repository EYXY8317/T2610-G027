<!-- ================= SUMMARY OVERLAY ================= -->
<div id="summary-popup-overlay">

    <!-- ================= SUMMARY POPUP ================= -->
    <div id="summary-setting-popup">

        <h2>📊 Summary Settings</h2>

        <!-- ================= DATA TYPE ================= -->

        <div class="setting-section">

            <h3>Chart Type</h3>

            <div class="mode-options">

                <div class="mode-card selected"
                     data-chart="line">

                    <h4>📈 Line Chart</h4>

                </div>

                <div class="mode-card"
                     data-chart="bar">

                    <h4>📊 Bar Chart</h4>

                </div>

                <div class="mode-card"
                     data-chart="pie">

                    <h4>🥧 Pie Chart</h4>

                </div>

            </div>

        </div>

        <hr>

        <!-- ================= FREQUENCY ================= -->

        <div class="setting-section">

            <h3>Frequency</h3>

            <div class="mode-options">

                <div class="mode-card selected"
                     data-frequency="week">

                    <h4>📅 Week</h4>

                </div>

                <div class="mode-card"
                     data-frequency="month">

                    <h4>🗓 Month</h4>

                </div>

                <div class="mode-card"
                     data-frequency="year">

                    <h4>📆 Year</h4>

                </div>

            </div>

        </div>

        <hr>

        <!-- ================= HIDE ================= -->

        <div class="setting-section">

            <div class="notification-card"
                 id="hide-summary-btn">

                🚫 Hide Summary Widget

            </div>

        </div>

    </div>

</div>
