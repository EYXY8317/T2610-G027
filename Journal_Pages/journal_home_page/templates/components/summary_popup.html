<!-- ================= SUMMARY OVERLAY ================= -->
<div id="summary-popup-overlay">

    <!-- ================= SUMMARY POPUP ================= -->
    <div id="summary-setting-popup">

        <h2>📊 Summary Settings</h2>

        <!-- ================= ANALYTICS CHART ================= -->

        <div class="setting-section">

            <h3>Analytics Charts</h3>

            <div class="mode-options">

                <div class="mode-card selected"
                    data-chart="line">

                     <h4>📈 Line Chart</h4>

                </div>

                <div class="mode-card"
                     data-chart="bar">

                <h4>📊 Bar Chart</h4>

                </div>

                <div class="mode-card"
                    data-chart="pie">

                <h4>🥧 Pie Chart</h4>

                </div>

            </div>

            <div class="mode-options">

                <div class="mode-card"
                    data-chart="doughnut">

                    <h4>🍩 Doughnut Chart</h4>

                </div>

            <div class="mode-card"
                data-chart="radar">

                <h4>🕸 Radar Chart</h4>

            </div>

        </div>

    </div>

<hr>

<!-- ================= MOOD VISUALIZATION ================= -->

<div class="setting-section">

    <h3>Mood Visualization</h3>

    <div class="mode-options">

        <div class="mode-card"
             data-chart="heatmap">

            <h4>🔥 Mood Heatmap</h4>

        </div>

        <div class="mode-card"
             data-chart="calendar">

            <h4>📅 Calendar Chart</h4>

        </div>

        <div class="mode-card"
             data-chart="emoji">

            <h4>😊 Emoji Chart</h4>

        </div>

    </div>

</div>

        <!-- ================= FREQUENCY ================= -->

        <div class="setting-section">

            <h3>Frequency</h3>

            <div class="mode-options">

                <div class="mode-card selected"
                     data-frequency="week">

                    <h4>📅 Week</h4>

                </div>

                <div class="mode-card"
                     data-frequency="month">

                    <h4>🗓 Month</h4>

                </div>

                <div class="mode-card"
                     data-frequency="year">

                    <h4>📆 Year</h4>

                </div>

            </div>

        </div>

        <hr>

        <!-- ================= HIDE ================= -->

        <div class="setting-section">

            <div class="notification-card"
                 id="hide-summary-btn">

                🚫 Hide Summary Widget

            </div>

        </div>

    </div>

</div>
