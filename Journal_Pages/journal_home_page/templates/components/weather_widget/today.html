    <div class="widget-controls">

        <button class="delete-widget-btn">
            ❌
        </button>

    </div>

    <!-- ================= HEADER ================= -->

    <div class="widget-header">

        <h2>
            ⛅ Today Weather
        </h2>

    </div>

    <!-- ================= WEATHER ICON ================= -->

    <img id="weather-icon">

    <!-- ================= TEMPERATURE ================= -->

    <h3 id="weather-temp"></h3>

    <p id="weather-status"></p>

    <div class="resize-handle">

        ↘

</div>
