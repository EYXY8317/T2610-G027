<!-- ================= CURRENT STREAK WIDGET ================= -->

<div class="widget"
     id="current-streak-widget">

    <!-- ================= WIDGET CONTROLS ================= -->

    <div class="widget-controls">

        <button class="delete-widget-btn">
            ❌
        </button>

    </div>

    <!-- ================= HEADER ================= -->

    <div class="widget-header">

        <h2>
            🔥 Current Streak
        </h2>

    </div>

    <!-- ================= CONTENT ================= -->

    <div class="widget-content">

        <p id="current-streak-text">

            {{ streak }} Day Streak

        </p>

    </div>

    <!-- ================= RESIZE HANDLE ================= -->

    <div class="resize-handle">

        ↘

    </div>

</div>
