<!-- ================= STREAK WIDGET ================= -->
<div class="widget" id="streak-widget">

    <div class="widget-header">

        <h2>🔥 Streak</h2>

        <button class="setting-btn">
            ⚙️
        </button>

    </div>

    <p id="streak-text"

       data-current="{{ streak }}"

       data-highest="{{ highest_streak }}">

        {{ streak }} Day Streak

    </p>

</div>
