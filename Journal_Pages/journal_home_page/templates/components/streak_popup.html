<!-- ================= POPUP OVERLAY ================= -->
<div id="popup-overlay">

    <!-- ================= STREAK SETTING POPUP ================= -->
    <div id="streak-setting-popup">

        <h2>🔥 Streak Settings</h2>

        <!-- ================= DISPLAY MODE ================= -->
        <div class="setting-section">

            <h3>Display Mode</h3>

            <div class="mode-options">

                <!-- DAILY -->
                <div class="mode-card selected"
                     data-mode="daily">

                    <h4>🔥 Record Daily Streak</h4>

                    <p>Show current streak progress</p>

                </div>

                <!-- HIGHEST -->
                <div class="mode-card"
                     data-mode="highest">

                    <h4>🏆 Show Highest Streak</h4>

                    <p>Display highest streak record</p>

                </div>

                <!-- HIDE -->
                <div class="mode-card"
                     data-mode="hide">

                    <h4>🚫 No Show</h4>

                    <p>Hide streak widget</p>

                </div>

            </div>

        </div>

        <hr>

        <!-- ================= NOTIFICATION ================= -->
        <div class="setting-section">

            <h3>Notification</h3>

            <div class="notification-card">

                🔔 Reminder Notification

            </div>

        </div>

    </div>

</div>
