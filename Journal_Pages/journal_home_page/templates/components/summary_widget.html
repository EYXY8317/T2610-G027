<!-- ================= SUMMARY WIDGET ================= -->
<div class="widget large-widget"
     id="summary-widget">

    <div class="widget-header">

        <h2>📊 Summary Data</h2>

        <button class="summary-setting-btn">
            ⚙️
        </button>

    </div>

    <!-- ================= SUMMARY CONTENT ================= -->

    <div class="summary-preview">

        <p id="summary-frequency-text">
            Weekly Mood Summary
        </p>

        <p id="chart-type-text">
            📈 Line Chart
        </p>

        <!-- ================= CHART ================= -->

        <canvas id="mood-chart"></canvas>

        <!-- ================= EMOJI CHART ================= -->

        <div id="emoji-chart"

             data-happy="{{ happy_count }}"

             data-sad="{{ sad_count }}"

             data-angry="{{ angry_count }}"

             style="display: none;">

            <span class="happy-emoji">
                😊
            </span>

            <span class="sad-emoji">
                😢
            </span>

            <span class="angry-emoji">
                😡
            </span>

        </div>

    </div>

    <hr>

    <!-- ================= WORD SUMMARY ================= -->

    <div class="word-summary">

        <h3>🧠 Word Summary</h3>

        <p id="word-summary-text">

            You felt calmer this week and
            stress levels were reduced.

        </p>

    </div>

</div>
