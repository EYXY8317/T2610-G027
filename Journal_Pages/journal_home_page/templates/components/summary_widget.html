<!-- ================= SUMMARY WIDGET ================= -->
<div class="widget large-widget"
     id="summary-widget">

    <div class="widget-header">

        <h2>📊 Summary Data</h2>

        <button class="summary-setting-btn">
            ⚙️
        </button>

    </div>

    <!-- ================= SUMMARY CONTENT ================= -->

    <div class="summary-preview">

        <p id="summary-frequency-text">
            Weekly Mood Summary
        </p>

        <canvas id="mood-chart"></canvas>

    </div>

    <hr>

    <!-- ================= WORD SUMMARY ================= -->

    <div class="word-summary">

        <h3>🧠 Word Summary</h3>

        <p id="word-summary-text">

            You felt calmer this week and
            stress levels were reduced.

        </p>

    </div>

</div>
