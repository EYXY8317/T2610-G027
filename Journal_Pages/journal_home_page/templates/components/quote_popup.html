<!-- ================= QUOTE POPUP ================= -->

<div id="quote-popup-overlay">

    <div id="quote-popup">

        <!-- ================= TITLE ================= -->

        <h2>
            Quote Setting
        </h2>


        <!-- ================= TYPE ================= -->

        <h3>
            Type
        </h3>

        <div class="mode-options"
             id="quote-type-options">

            <!-- ================= OWN ================= -->

            <div class="mode-card type-card"
                 data-type="own">

                <h4>
                    Own
                </h4>

            </div>

            <!-- ================= SAVE ================= -->

            <div class="mode-card type-card"
                 data-type="save">

                <h4>
                    Save
                </h4>

            </div>

            <!-- ================= RANDOM ================= -->

            <div class="mode-card type-card"
                 data-type="random">

                <h4>
                    Random
                </h4>

            </div>

            <!-- ================= HIDE ================= -->

            <div class="mode-card type-card"
                 data-type="hide">

                <h4>
                    Hide
                </h4>

            </div>

        </div>


        <!-- ================= OWN QUOTE SECTION ================= -->

        <div id="own-quote-section">

            <hr>

            <h3>
                Your Quote
            </h3>

            <textarea
                id="own-quote-input"
                placeholder="Write your own quote..."></textarea>

            <button id="save-own-quote-btn">

                Save Quote

            </button>

        </div>


        <!-- ================= SAVED QUOTE SECTION ================= -->

        <div id="saved-quote-section">

            <hr>

            <h3>
                Saved Quotes
            </h3>

            <div id="saved-quotes-list">

                <!-- JS will inject saved quotes -->
                <!-- JavaScript 会自动加入 saved quote -->

            </div>

        </div>


        <!-- ================= RANDOM CATEGORY ================= -->

        <div id="quote-category-section">

            <hr>

            <h3>
                Random Category
            </h3>

            <div class="mode-options">

                <div class="mode-card category-card">

                    <h4>
                        Motivation
                    </h4>

                </div>

                <div class="mode-card category-card">

                    <h4>
                        Calm
                    </h4>

                </div>

                <div class="mode-card category-card">

                    <h4>
                        Self-love
                    </h4>

                </div>

                <div class="mode-card category-card">

                    <h4>
                        Study
                    </h4>

                </div>

                <div class="mode-card category-card">

                    <h4>
                        Humor
                    </h4>

                </div>

                <div class="mode-card category-card">

                    <h4>
                        Life Reflection
                    </h4>

                </div>

            </div>

        </div>


        <hr>


        <!-- ================= FREQUENCY ================= -->

        <h3>
            Frequency
        </h3>

        <div class="mode-options">

            <div class="mode-card frequency-card selected">

                <h4>
                    Reload
                </h4>

            </div>

            <div class="mode-card frequency-card">

                <h4>
                    Day
                </h4>

            </div>

            <div class="mode-card frequency-card">

                <h4>
                    Week
                </h4>

            </div>

        </div>


        <hr>


        <!-- ================= THEME ================= -->

        <h3>
            Theme
        </h3>

        <div class="mode-options">

            <div class="mode-card theme-card selected">

                <h4>
                    Minimal
                </h4>

            </div>

            <div class="mode-card theme-card">

                <h4>
                    Soft
                </h4>

            </div>

            <div class="mode-card theme-card">

                <h4>
                    Dark
                </h4>

            </div>

        </div>

    </div>

</div>
