<!-- ================= WEATHER WIDGET ================= -->

<div class="widget"
     id="weather-widget">

    <!-- ================= HEADER ================= -->

    <div class="widget-header">

        <h2>
            ⛅ Weather
        </h2>

    </div>

    <!-- ================= WEATHER ICON ================= -->

    <img id="weather-icon">

    <!-- ================= TEMPERATURE ================= -->

    <h3 id="weather-temp"></h3>

    <!-- ================= STATUS ================= -->

    <p id="weather-status"></p>

    <p id="weather-location"></p>

    <!-- ================= TOMORROW WEATHER ================= -->

    <div id="tomorrow-weather">

    </div>

    <!-- ================= WEEKLY WEATHER ================= -->

    <div id="weekly-weather">

    </div>

    <!-- ================= WEATHER CHART ================= -->

    <div class="chart-container">

        <canvas id="weather-chart"></canvas>

    </div>

</div>

<!-- ================= CHART JS ================= -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
